name: QA Smoke (XGEN 기능 스모크)

# 경로 A — CI 파이프라인형 QA 실행.
# 러너가 실제 XGEN에 로그인·메뉴 검증 → results.json + 스크린샷을 리포에 커밋 →
# go244 배포가 갱신 → 콘솔(https://labs.plateer.com/qa-console/index.html)이 최신 실결과 표시.
#
# 사전 준비(1회): 리포 Settings > Secrets and variables > Actions 에
#   QA_EMAIL = x2bee_ds@plateer.com
#   QA_PASS  = (해당 계정 비밀번호)
# 를 등록. (운영 환경은 읽기 스모크만 — 쓰기 케이스는 stg 전용)
#
# 주의: GitHub 호스팅 러너에서 대상 XGEN(dev/stg)에 네트워크 접근이 가능해야 함.
#       내부망에서만 접근된다면 self-hosted 러너 또는 qa/.gitlab-ci.yml(내부 GitLab) 사용.

on:
  workflow_dispatch:
    inputs:
      env:
        description: '대상 환경 (dev / stg)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, stg]
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (21:00 UTC) 자동 스모크

permissions:
  contents: write

concurrency:
  group: qa-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # 내부망 stg/dev에 접근 가능한 go244 자체호스팅 러너 + Playwright 컨테이너(브라우저·node 사전탑재).
    # (GitHub 클라우드 러너는 내부 XGEN에 네트워크 접근이 안 될 수 있어 self-hosted로 실행)
    runs-on: [self-hosted, go244]
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-jammy
      options: --user root
    steps:
      - name: Ensure git
        run: command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y git)
      - uses: actions/checkout@v4
      - name: Install deps
        working-directory: qa
        run: npm install --no-audit --no-fund
      - name: Run QA smoke
        env:
          QA_ENV: ${{ github.event.inputs.env || 'dev' }}
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASS: ${{ secrets.QA_PASS }}
        run: node qa/qa-runner.mjs
        continue-on-error: true   # 실패 케이스가 있어도 리포트는 커밋
      - name: Commit results
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git add frontend/public/qa-console/results.json frontend/public/qa-console/shots || true
          git commit -m "chore(qa): smoke results ($(date -u +%FT%TZ))" || echo "no changes"
          git push
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: frontend/public/qa-console/results.json
