services:
  frontend:
    build:
      context: ./frontend
      args:
        # 브라우저가 치는 URL(빌드 시 주입). same-origin 프록시 경로 → Next 서버가
        # GALLERY_API_ORIGIN(아래 environment)으로 서버사이드 프록시한다. 예전처럼
        # http://localhost:8800을 굽지 않는다(원격 방문자 브라우저에선 실패).
        NEXT_PUBLIC_GALLERY_API_URL: /gallery-api
    ports:
      - "3100:3000"
    env_file:
      - .env
    environment:
      # 갤러리 데모 API의 서버사이드 프록시 대상(same-origin /gallery-api → 이 오리진).
      # 컴포즈 네트워크 안에서 backend 컨테이너는 서비스명:내부포트(backend:8000)로 접근.
      GALLERY_API_ORIGIN: "${GALLERY_API_ORIGIN:-http://backend:8000}"
      # Members 탭: GitHub Org People 동적 로드용 (서버 캐시 30분)
      GITHUB_ORG: "${GITHUB_ORG:-PlateerLab}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      MEMBERS_REVALIDATE_SECONDS: "${MEMBERS_REVALIDATE_SECONDS:-1800}"
      MEMBERS_REVALIDATE_TOKEN: "${MEMBERS_REVALIDATE_TOKEN:-}"
      # Members 데이터 소스: 설정 시 GitHub 직접 호출 대신 다른 갤러리 배포본의
      # /api/members(목록)·/api/members/{login}(상세)에서 가져옴.
      # ⚠️ 기본값은 반드시 비워둘 것. 이 박스(go244)의 공개 도메인
      # (gallery-xgen.x2bee.com)은 AWS nginx를 거쳐 다시 이 박스로 프록시되므로,
      # 그 도메인을 upstream으로 지정하면 앱이 자기 자신을 호출하는 무한 루프 →
      # 타임아웃 → 502가 된다. 이 박스는 GITHUB_TOKEN을 가지고 GitHub를 직접 친다.
      MEMBERS_UPSTREAM_URL: "${MEMBERS_UPSTREAM_URL:-}"
      # ⚠️ 웹훅 URL(DEMO_WEBHOOK_URL·NEWSLETTER_WEBHOOK_URL)과 블로그 OAuth 자격증명
      #    (GITHUB_OAUTH_CLIENT_ID/SECRET)은 위 env_file(.env)로만 주입한다.
      #    여기 environment 블록에 "${VAR:-}" 형태로 다시 선언하지 말 것 —
      #    environment는 env_file보다 우선순위가 높다. 다른 디렉터리에서 compose를
      #    실행하거나 셸에 해당 변수가 없으면 ${...} 인터폴레이션이 빈 값이 되어
      #    그 빈 값이 .env 값을 덮어써(clobber) 웹훅이 조용히 죽는다(리드 유실).
      #    (실제로 이 함정을 밟았음 — DEMO/NEWSLETTER_WEBHOOK_URL을 여기서 제거함)
      #    설정 방법: docs/demo-webhook.gs · docs/newsletter-webhook.gs · docs/blog-cms.md
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8800:8000"
    env_file:
      - .env
    environment:
      # Synaptic Memory graph persistence (per-container unless volume mounted)
      SYNAPTIC_DB: /tmp/synaptic.db
      # 블로그 조회수 DB — 볼륨(views_data)에 두어 재빌드에도 값 유지
      VIEWS_DB: /data/views.db
      # Embeddings (Qwen vLLM by default, no auth).
      SYNAPTIC_EMBED_URL: "${SYNAPTIC_EMBED_URL:-}"
      SYNAPTIC_EMBED_MODEL: "${SYNAPTIC_EMBED_MODEL:-default}"
      # LLM chat completions (OpenAI-compatible upstream).
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      # Legacy fallback for the openai-proxy path.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - views_data:/data

volumes:
  views_data:
