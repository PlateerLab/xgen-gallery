<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360" fill="none" role="img" aria-label="AI 검색 에이전트 — 자연어 질의를 의미 기반 태그로 확장해 검색">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#3730a3" flood-opacity="0.12"/></filter>
  </defs>
  <!-- 검색바 -->
  <g filter="url(#s)"><rect x="18" y="16" width="464" height="62" rx="31" fill="#ffffff"/></g>
  <rect x="18" y="16" width="464" height="62" rx="31" fill="none" stroke="#e6e8f4"/>
  <circle cx="58" cy="47" r="12" fill="none" stroke="#2563eb" stroke-width="3.4"/>
  <line x1="67" y1="56" x2="77" y2="66" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round"/>
  <text x="96" y="56" font-family="Pretendard, system-ui, sans-serif" font-size="27" fill="#1e2540">날씬해 보이는 바지</text>

  <g stroke="#c2ccea" stroke-width="2.6">
    <line x1="250" y1="205" x2="250" y2="120"/>
    <line x1="250" y1="205" x2="132" y2="150"/>
    <line x1="250" y1="205" x2="368" y2="150"/>
    <line x1="250" y1="205" x2="146" y2="286"/>
    <line x1="250" y1="205" x2="354" y2="286"/>
    <line x1="250" y1="205" x2="404" y2="212"/>
  </g>

  <g font-family="Pretendard, system-ui, sans-serif" text-anchor="middle">
    <g filter="url(#s)"><rect x="200" y="178" width="100" height="54" rx="27" fill="#2563eb"/></g>
    <text x="250" y="214" font-size="27" font-weight="700" fill="#ffffff"># 바지</text>
    <g font-size="24" font-weight="600" fill="#33436e">
      <rect x="196" y="96" width="108" height="50" rx="25" fill="#eef3ff" stroke="#c9d6f5"/><text x="250" y="129"># 슬림</text>
      <rect x="72" y="124" width="112" height="50" rx="25" fill="#eef3ff" stroke="#c9d6f5"/><text x="128" y="157"># 데님</text>
      <rect x="316" y="124" width="112" height="50" rx="25" fill="#eef3ff" stroke="#c9d6f5"/><text x="372" y="157"># 스판</text>
      <rect x="88" y="260" width="112" height="50" rx="25" fill="#eef3ff" stroke="#c9d6f5"/><text x="144" y="293"># 편한</text>
      <rect x="296" y="260" width="128" height="50" rx="25" fill="#eef3ff" stroke="#c9d6f5"/><text x="360" y="293"># 슬림핏</text>
      <rect x="348" y="188" width="128" height="50" rx="25" fill="#eef3ff" stroke="#c9d6f5"/><text x="412" y="221"># 부츠컷</text>
    </g>
  </g>

  <text x="250" y="344" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="20" fill="#6b7396">의미가 비슷한 태그로 검색을 확장합니다</text>
</svg>
