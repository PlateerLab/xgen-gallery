<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 320" width="1240" height="320" fill="none" role="img" aria-label="Polar 작동 방식 — 사용자 질문 → Polar sLLM → RAG 검색 → 정확한 답변">
  <defs>
    <linearGradient id="polarHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3730a3" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- arrows -->
  <g stroke="url(#arrow)" stroke-width="3" fill="none" marker-end="url(#ah)">
    <defs>
      <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
        <path d="M0 0 L8 5 L0 10 z" fill="#6366f1"/>
      </marker>
    </defs>
    <line x1="274" y1="160" x2="330" y2="160"/>
    <line x1="590" y1="160" x2="646" y2="160"/>
    <line x1="906" y1="160" x2="962" y2="160"/>
  </g>

  <!-- Card 1: 사용자 질문 -->
  <g filter="url(#soft)"><rect x="20" y="60" width="252" height="200" rx="20" fill="#ffffff"/></g>
  <rect x="20" y="60" width="252" height="200" rx="20" fill="none" stroke="#e8eaf4"/>
  <circle cx="60" cy="108" r="22" fill="#eff4ff"/>
  <path d="M50 102 h20 a4 4 0 0 1 4 4 v8 a4 4 0 0 1 -4 4 h-9 l-6 6 v-6 h-5 a4 4 0 0 1 -4 -4 v-8 a4 4 0 0 1 4 -4 z" fill="#2563eb"/>
  <text x="96" y="106" font-family="Pretendard, system-ui, sans-serif" font-size="19" font-weight="700" fill="#141a2e">사용자 질문</text>
  <text x="96" y="128" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#2563eb">User Question</text>
  <text x="40" y="188" font-family="Pretendard, system-ui, sans-serif" font-size="15" fill="#5b6484">커머스 문의를 자연어로</text>
  <text x="40" y="212" font-family="Pretendard, system-ui, sans-serif" font-size="15" fill="#5b6484">입력받습니다</text>

  <!-- Card 2: Polar sLLM (primary) -->
  <g filter="url(#soft)"><rect x="336" y="60" width="252" height="200" rx="20" fill="#ffffff"/></g>
  <path d="M336 80 a20 20 0 0 1 20 -20 h212 a20 20 0 0 1 20 20 v16 h-252 z" fill="url(#polarHead)"/>
  <text x="356" y="86" font-family="Pretendard, system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Polar · sLLM</text>
  <rect x="336" y="60" width="252" height="200" rx="20" fill="none" stroke="#e0e3f4"/>
  <g font-family="Pretendard, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4b47b8">
    <rect x="356" y="118" width="96" height="30" rx="15" fill="#eef2ff"/><text x="372" y="138">질의 분석</text>
    <rect x="356" y="156" width="96" height="30" rx="15" fill="#eef2ff"/><text x="372" y="176">생성 요청</text>
    <rect x="356" y="194" width="96" height="30" rx="15" fill="#eef2ff"/><text x="372" y="214">답변 검증</text>
  </g>
  <g font-family="Pretendard, system-ui, sans-serif" font-size="12.5" fill="#7a80a4">
    <text x="470" y="138">도메인 최적화</text>
    <text x="470" y="176">Fine-tuning</text>
    <text x="470" y="214">근거 기반</text>
  </g>

  <!-- Card 3: RAG 검색 -->
  <g filter="url(#soft)"><rect x="652" y="60" width="252" height="200" rx="20" fill="#ffffff"/></g>
  <rect x="652" y="60" width="252" height="200" rx="20" fill="none" stroke="#e8eaf4"/>
  <circle cx="692" cy="108" r="22" fill="#ecfbfb"/>
  <circle cx="689" cy="105" r="7" fill="none" stroke="#0891b2" stroke-width="3"/>
  <line x1="694" y1="110" x2="700" y2="116" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/>
  <text x="728" y="106" font-family="Pretendard, system-ui, sans-serif" font-size="19" font-weight="700" fill="#141a2e">RAG 검색</text>
  <text x="728" y="128" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#0891b2">Retrieval</text>
  <text x="672" y="188" font-family="Pretendard, system-ui, sans-serif" font-size="15" fill="#5b6484">지식베이스에서 검색하고</text>
  <text x="672" y="212" font-family="Pretendard, system-ui, sans-serif" font-size="15" fill="#5b6484">ReRANKER로 재정렬</text>

  <!-- Card 4: 정확한 답변 -->
  <g filter="url(#soft)"><rect x="968" y="60" width="252" height="200" rx="20" fill="#ffffff"/></g>
  <rect x="968" y="60" width="252" height="200" rx="20" fill="none" stroke="#e8eaf4"/>
  <circle cx="1008" cy="108" r="22" fill="#ecfdf3"/>
  <path d="M999 108 l6 6 l12 -13" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1044" y="106" font-family="Pretendard, system-ui, sans-serif" font-size="19" font-weight="700" fill="#141a2e">정확한 답변</text>
  <text x="1044" y="128" font-family="Pretendard, system-ui, sans-serif" font-size="13" fill="#059669">Answer</text>
  <text x="988" y="188" font-family="Pretendard, system-ui, sans-serif" font-size="15" fill="#5b6484">근거 있는 커머스 답변을</text>
  <text x="988" y="212" font-family="Pretendard, system-ui, sans-serif" font-size="15" fill="#5b6484">생성합니다</text>
</svg>
