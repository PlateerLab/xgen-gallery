<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" fill="none" role="img" aria-label="도메인 최적화 모델 — 이커머스 데이터 학습에서 맞춤 Fine-Tuning으로">
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#3730a3" flood-opacity="0.1"/></filter></defs>
  <!-- 좌: 이커머스 데이터 학습 -->
  <g filter="url(#s)"><rect x="20" y="40" width="270" height="190" rx="18" fill="#ffffff"/></g>
  <rect x="20" y="40" width="270" height="190" rx="18" fill="none" stroke="#e6e8f4"/>
  <text x="155" y="76" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="21" font-weight="700" fill="#1e2540">이커머스 데이터 학습</text>
  <g font-family="Pretendard, system-ui, sans-serif" font-size="18" font-weight="600" fill="#3b4a72" text-anchor="middle">
    <rect x="42" y="100" width="106" height="44" rx="12" fill="#eef3ff"/><text x="95" y="128">상품 데이터</text>
    <rect x="162" y="100" width="106" height="44" rx="12" fill="#eef3ff"/><text x="215" y="128">카테고리</text>
    <rect x="42" y="158" width="106" height="44" rx="12" fill="#eef3ff"/><text x="95" y="186">상품설명</text>
    <rect x="162" y="158" width="106" height="44" rx="12" fill="#eef3ff"/><text x="215" y="186">리뷰</text>
  </g>
  <!-- 화살표 -->
  <path d="M300 135 L344 135" stroke="#8b93b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M338 128 L350 135 L338 142 z" fill="#8b93b8"/>
  <!-- 우: 맞춤 Fine-Tuning -->
  <g filter="url(#s)"><rect x="360" y="40" width="260" height="190" rx="18" fill="#ffffff"/></g>
  <rect x="360" y="40" width="260" height="190" rx="18" fill="none" stroke="#c9d6f5"/>
  <text x="490" y="76" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="21" font-weight="700" fill="#2563eb">맞춤 Fine-Tuning</text>
  <g font-family="Pretendard, system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="380" y="100" width="106" height="44" rx="12" fill="#4f7bf0"/><text x="433" y="128">감정 분류</text>
    <rect x="498" y="100" width="106" height="44" rx="12" fill="#4f7bf0"/><text x="551" y="128">의도 분류</text>
    <rect x="380" y="158" width="106" height="44" rx="12" fill="#4f7bf0"/><text x="433" y="186">개체명 인식</text>
    <rect x="498" y="158" width="106" height="44" rx="12" fill="#4f7bf0"/><text x="551" y="186">요약 생성</text>
  </g>
</svg>
