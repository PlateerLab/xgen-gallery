<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="보안·규제로 외부 클라우드 AI를 쓰기 어려운 상황">
  <defs>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00acee"/><stop offset="1" stop-color="#185aea"/></linearGradient>
  </defs>
  <rect width="320" height="190" rx="16" fill="#f4f8ff"/>
  <!-- external cloud (blocked) -->
  <g opacity="0.65">
    <path d="M212 52 a20 20 0 0 1 39 5 a16 16 0 0 1 -3 31 h-38 a17 17 0 0 1 -2 -34 a20 20 0 0 1 4 -2 z" fill="#ffffff" stroke="#c0ccdf" stroke-width="2"/>
    <text x="230" y="82" text-anchor="middle" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Cloud AI</text>
  </g>
  <!-- prohibited over cloud -->
  <circle cx="230" cy="66" r="20" fill="none" stroke="#ef8f8f" stroke-width="3"/>
  <line x1="216" y1="52" x2="244" y2="80" stroke="#ef8f8f" stroke-width="3" stroke-linecap="round"/>
  <!-- shield with lock (기업 내부 보호) -->
  <path d="M78 40 l40 14 v34 c0 32 -22 52 -40 62 c-18 -10 -40 -30 -40 -62 V54 z" fill="url(#c3)" opacity="0.12"/>
  <path d="M78 40 l40 14 v34 c0 32 -22 52 -40 62 c-18 -10 -40 -30 -40 -62 V54 z" fill="none" stroke="url(#c3)" stroke-width="3"/>
  <rect x="64" y="80" width="28" height="22" rx="4" fill="url(#c3)"/>
  <path d="M70 80 v-7 a8 8 0 0 1 16 0 v7" fill="none" stroke="url(#c3)" stroke-width="4"/>
  <circle cx="78" cy="90" r="3.5" fill="#ffffff"/>
  <rect x="76.5" y="90" width="3" height="7" fill="#ffffff"/>
  <!-- blocked data flow from shield to cloud -->
  <path d="M120 78 L 196 70" fill="none" stroke="#c7d3ea" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
</svg>
