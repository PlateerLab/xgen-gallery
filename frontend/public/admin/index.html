<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Plateer AI Labs — 관리자</title>
        <!-- /admin(트레일링 슬래시 없음)에서도 config.yml을 정확히 찾도록 절대경로 명시 -->
        <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
        <style>
            :root { --admin-gnb-width: 204px; }
            * { box-sizing: border-box; }
            html, body { margin: 0; background: #fff; color: #17191c; }
            body { padding-left: var(--admin-gnb-width) !important; }
            .admin-gnb { position: fixed; z-index: 1000; inset: 0 auto 0 0; width: var(--admin-gnb-width); padding: 28px 20px; background: #f7f8fa; font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
            .admin-gnb strong { display: block; margin-bottom: 28px; font-size: 15px; }
            .admin-gnb a { display: block; padding: 10px 0; color: #17191c; font-size: 14px; line-height: 1.5; text-decoration: none; }
            .admin-gnb a[aria-current="page"] { font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
            @media (max-width: 900px) {
                body { padding-left: 0 !important; padding-top: 61px !important; }
                .admin-gnb { inset: 0 0 auto; width: auto; height: 61px; padding: 10px 20px; display: flex; align-items: center; gap: 24px; overflow-x: auto; }
                .admin-gnb strong { margin: 0; white-space: nowrap; }
                .admin-gnb nav { display: flex; gap: 24px; }
                .admin-gnb a { white-space: nowrap; }
            }
        </style>
    </head>
    <body>
        <aside class="admin-gnb" aria-label="관리자 메뉴">
            <strong>Plateer AI Labs</strong>
            <nav>
                <a href="/admin" aria-current="page">블로그</a>
                <a href="/admin/governance">거버넌스</a>
                <a href="/admin/newsletter">뉴스레터</a>
                <a href="/admin/guides">운영 가이드</a>
                <a href="/admin/signature">이메일 서명</a>
            </nav>
        </aside>
        <!-- Decap CMS — DB 없이 git(content/blog/*.md)에 글을 커밋하는 어드민.
             설정은 ./config.yml 참고. 로컬 편집: `npx decap-server` 실행 후 /admin 접속. -->
        <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
        <script>
            // 좌측 Collections 목록 아래에 블로그 작성 가이드 링크(새 탭)를 추가한다.
            //
            // ⚠ 과거엔 CMS.registerAdditionalLink()를 썼지만, 현재 배포되는 decap-cms 번들의
            //   window.CMS 에는 그 API가 없어(존재하지 않음) 링크가 조용히 사라졌다.
            //   그래서 Decap 내부 API에 의존하지 않고, 라우트(#/collections/...) 기반으로
            //   실제 사이드바 항목 옆에 DOM 링크를 주입한다. emotion 클래스명 변화에도 안전.
            (function () {
                // 순서대로 사이드바 하단에 붙는다(배열 순서 = 표시 순서).
                var GUIDES = [
                    { id: "guide-writing-link", url: "/guides/blog-writing.html", label: "📖 블로그 작성 가이드" },
                ];

                function inject() {
                    // 컬렉션 내비 링크는 항상 해시 라우트를 쓴다 → 버전 무관하게 안정적인 앵커.
                    var navLink = document.querySelector('a[href^="#/collections/"]');
                    if (!navLink) return;
                    var item = navLink.closest("li") || navLink;
                    var list = item.parentElement;
                    if (!list) return;

                    GUIDES.forEach(function (g) {
                        if (document.getElementById(g.id)) return; // 멱등

                        var a = document.createElement("a");
                        a.id = g.id;
                        a.href = g.url;
                        a.target = "_blank";
                        a.rel = "noopener";
                        a.textContent = g.label;
                        a.className = navLink.className; // 기존 항목과 동일한 룩앤필
                        a.style.display = "block";
                        a.style.opacity = "0.85"; // 컬렉션이 아니라 외부 가이드임을 살짝 구분

                        if (item.tagName === "LI") {
                            var li = document.createElement("li");
                            li.className = item.className;
                            li.appendChild(a);
                            list.appendChild(li);
                        } else {
                            list.appendChild(a);
                        }
                    });
                }

                // 로그인 후 사이드바가 비동기로 렌더되므로 관찰하며 주입(제거되면 재주입).
                new MutationObserver(inject).observe(document.documentElement, {
                    childList: true,
                    subtree: true,
                });
                document.addEventListener("DOMContentLoaded", inject);
            })();
        </script>
    </body>
</html>
