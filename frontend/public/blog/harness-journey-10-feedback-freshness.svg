  <text x="92" y="330" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="46" font-weight="800" fill="#0f172a">교훈을 최신</text>
  <text x="92" y="388" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="46" font-weight="800" fill="#4f46e5">상태로 이월</text>
  <rect x="92" y="440" width="320" height="52" rx="26" fill="#e0e7ff"/>
  <text x="118" y="474" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#4338ca">피드백 · 프레시니스</text>

  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <!-- 실행 타임라인 -->
  <line x1="690" y1="420" x2="1050" y2="420" stroke="#c7d2fe" stroke-width="4"/>
  <circle cx="710" cy="420" r="12" fill="#c7d2fe"/>
  <circle cx="810" cy="420" r="12" fill="#a5b4fc"/>
  <circle cx="910" cy="420" r="12" fill="#6366f1"/>
  <circle cx="1030" cy="420" r="18" fill="url(#badge)"/>
  <text x="710" y="456" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#94a3d8">run1</text>
  <text x="810" y="456" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#94a3d8">run2</text>
  <text x="910" y="456" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#7c86e6">run3</text>
  <text x="1030" y="460" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#4338ca">now</text>
