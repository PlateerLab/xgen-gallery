<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="B2B 거래처의 반복 발주 패턴이 흔들리는 지점을 신호로 잡아, 이탈 판단과 근거, 영업 대응까지 잇는 흐름">
  <defs>
    <!-- 현장 리포트 전용 — 밝은 실버 그라디언트 바탕에 객체만 퍼플.
         바탕에서 색을 빼 가볍게 두고, 퍼플은 신호가 되는 자리에만 쓴다. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#e8eaef"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="steady" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd2da"/>
      <stop offset="1" stop-color="#e3e6eb"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2b3138" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="220" fill="#a78bfa" opacity="0.07"/>
  <circle cx="120" cy="620" r="180" fill="#7c3aed" opacity="0.05"/>

  <!-- 타이틀 -->
  <text x="600" y="106" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#7c3aed" letter-spacing="5">FIELD REPORT</text>
  <text x="600" y="164" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="44" font-weight="800" fill="#111827">패턴이 흔들리는 지점</text>

  <!-- 발주 패턴 — 일정하게 반복되다 뒤로 갈수록 낮아지고 간격이 벌어진다 -->
  <text x="152" y="242" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" font-weight="600" fill="#6b7280" letter-spacing="2">거래처 발주 패턴</text>
  <g>
    <rect x="152" y="266" width="38" height="98" rx="10" fill="url(#steady)"/>
    <rect x="208" y="278" width="38" height="86" rx="10" fill="url(#steady)"/>
    <rect x="264" y="270" width="38" height="94" rx="10" fill="url(#steady)"/>
    <rect x="320" y="280" width="38" height="84" rx="10" fill="url(#steady)"/>
    <rect x="384" y="304" width="38" height="60" rx="10" fill="url(#warn)" opacity="0.4"/>
    <rect x="460" y="320" width="38" height="44" rx="10" fill="url(#warn)" opacity="0.7"/>
    <rect x="548" y="334" width="38" height="30" rx="10" fill="#6d28d9"/>
    <line x1="152" y1="376" x2="606" y2="376" stroke="#d3d7de" stroke-width="2" stroke-linecap="round"/>
    <text x="152" y="404" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#9ca3af">일정한 주기</text>
    <text x="606" y="404" text-anchor="end" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="700" fill="#7c3aed">주기 지연 · 물량 감소</text>
  </g>

  <!-- 신호 → 판단 → 근거 → 대응 -->
  <g font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <rect x="672" y="250" width="384" height="54" rx="14" fill="url(#brand)"/>
    <text x="698" y="284" font-size="18" font-weight="700" fill="#ffffff">이상 변화 탐지</text>

    <g filter="url(#sh)">
      <rect x="672" y="316" width="384" height="50" rx="14" fill="#ffffff"/>
      <rect x="672" y="378" width="384" height="50" rx="14" fill="#ffffff"/>
    </g>
    <rect x="672" y="316" width="384" height="50" rx="14" fill="none" stroke="#e3e6eb"/>
    <text x="698" y="347" font-size="16" font-weight="500" fill="#374151">이탈 가능성 판단</text>
    <rect x="672" y="378" width="384" height="50" rx="14" fill="none" stroke="#e3e6eb"/>
    <text x="698" y="409" font-size="16" font-weight="500" fill="#374151">판단 근거 제시</text>

    <rect x="672" y="440" width="384" height="54" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="698" y="474" font-size="17" font-weight="700" fill="#6d28d9">영업 대응 전략 추천</text>
  </g>
  <path d="M622 340 L656 340" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6 7" opacity="0.7" stroke-linecap="round"/>
  <path d="M650 334 L657 340 L650 346" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- 하단 요약 -->
  <text x="600" y="562" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#4b5563">누가 이탈하는가보다, 무엇이 달라졌고 무엇을 할 것인가</text>

  <g font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15" fill="#6b7280">
    <rect x="336" y="600" width="164" height="38" rx="19" fill="#ffffff" stroke="#e3e6eb"/>
    <text x="418" y="625" text-anchor="middle">B2B 거래 패턴</text>
    <rect x="516" y="600" width="168" height="38" rx="19" fill="#ffffff" stroke="#e3e6eb"/>
    <text x="600" y="625" text-anchor="middle">Prediction → Action</text>
    <rect x="700" y="600" width="164" height="38" rx="19" fill="#ffffff" stroke="#e3e6eb"/>
    <text x="782" y="625" text-anchor="middle">Enterprise AI PoC</text>
  </g>
</svg>
