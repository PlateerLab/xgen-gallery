<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="B2B 거래처의 반복 발주 패턴이 흔들리는 지점을 신호로 잡아, 이탈 판단과 근거, 영업 대응까지 잇는 흐름">
  <defs>
    <!-- 필드 노트 전용 배경(그래파이트) — 현장 기록·계기판 계열의 색으로,
         제품 소식 커버의 남색과 목록에서 갈라 보이게 한다. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151b"/>
      <stop offset="1" stop-color="#1e2833"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="380" r="340" fill="url(#glow)"/>

  <!-- 타이틀 -->
  <text x="600" y="106" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#fbbf24" letter-spacing="5">FIELD NOTE</text>
  <text x="600" y="162" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="700" fill="#ffffff">패턴이 흔들리는 지점</text>

  <!-- 발주 패턴 — 일정하게 반복되다 뒤로 갈수록 낮아지고 간격이 벌어진다 -->
  <text x="150" y="238" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#fbbf24" letter-spacing="2">거래처 발주 패턴</text>
  <g>
    <rect x="150" y="258" width="34" height="96" rx="8" fill="#94a3b8" opacity="0.9"/>
    <rect x="204" y="270" width="34" height="84" rx="8" fill="#94a3b8" opacity="0.84"/>
    <rect x="258" y="262" width="34" height="92" rx="8" fill="#94a3b8" opacity="0.88"/>
    <rect x="312" y="272" width="34" height="82" rx="8" fill="#94a3b8" opacity="0.82"/>
    <rect x="372" y="296" width="34" height="58" rx="8" fill="#cbd5e1" opacity="0.5"/>
    <rect x="444" y="312" width="34" height="42" rx="8" fill="#f59e0b" opacity="0.8"/>
    <rect x="528" y="326" width="34" height="28" rx="8" fill="#ef4444" opacity="0.85"/>
    <line x1="150" y1="366" x2="600" y2="366" stroke="#ffffff24" stroke-width="2"/>
    <text x="167" y="392" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ffffff5c">일정한 주기</text>
    <text x="500" y="392" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#f59e0bcc">주기 지연 · 물량 감소</text>
  </g>

  <!-- 신호 → 판단 → 근거 → 대응 -->
  <g font-family="system-ui,-apple-system,sans-serif">
    <rect x="664" y="246" width="392" height="52" rx="12" fill="url(#brand)"/>
    <text x="688" y="278" font-size="18" font-weight="700" fill="#1a1206">이상 변화 탐지</text>

    <rect x="664" y="310" width="392" height="50" rx="12" fill="#ffffff10" stroke="#ffffff24"/>
    <text x="688" y="341" font-size="16" font-weight="600" fill="#ffffffcc">이탈 가능성 판단</text>

    <rect x="664" y="372" width="392" height="50" rx="12" fill="#ffffff10" stroke="#ffffff24"/>
    <text x="688" y="403" font-size="16" font-weight="600" fill="#ffffffcc">판단 근거 제시</text>

    <rect x="664" y="434" width="392" height="50" rx="12" fill="#f59e0b1f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="688" y="465" font-size="16" font-weight="700" fill="#fbbf24">영업 대응 전략 추천</text>
  </g>
  <path d="M604 306 L648 306" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.7"/>
  <path d="M641 300 L648 306 L641 312" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- 하단 요약 -->
  <text x="600" y="556" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#ffffff8f">누가 이탈하는가보다, 무엇이 달라졌고 무엇을 할 것인가</text>

  <g font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#ffffff70">
    <rect x="336" y="596" width="164" height="38" rx="19" fill="#ffffff0d" stroke="#ffffff24"/>
    <text x="418" y="621" text-anchor="middle">B2B 거래 패턴</text>
    <rect x="516" y="596" width="168" height="38" rx="19" fill="#ffffff0d" stroke="#ffffff24"/>
    <text x="600" y="621" text-anchor="middle">Prediction → Action</text>
    <rect x="700" y="596" width="164" height="38" rx="19" fill="#ffffff0d" stroke="#ffffff24"/>
    <text x="782" y="621" text-anchor="middle">Enterprise AI PoC</text>
  </g>
</svg>
