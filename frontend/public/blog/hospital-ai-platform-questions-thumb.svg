<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="병원의 문서와 DB, API 가 정책 관문을 지나 AI Agent 로 이어지는 모습">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e8eaef"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="486" r="330" fill="url(#glow)"/>

  <text x="600" y="170" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#111827">어디까지</text>
  <text x="600" y="276" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#7c3aed">연결할 것인가</text>

  <!-- 병원이 이미 가진 것들 -->
  <g>
    <rect x="230" y="352" width="190" height="64" rx="18" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="230" y="432" width="190" height="64" rx="18" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="230" y="512" width="190" height="64" rx="18" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
  </g>
  <g font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="26" font-weight="600" fill="#4b5563" text-anchor="middle">
    <text x="325" y="393">문서 · 기록</text>
    <text x="325" y="473">운영 DB</text>
    <text x="325" y="553">기존 API</text>
  </g>

  <!-- 정책 관문 — 연결과 권한은 다르게 설계한다 -->
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M420 384 C492 384 492 464 560 464"/>
    <path d="M420 464 h140"/>
    <path d="M420 544 C492 544 492 464 560 464"/>
  </g>
  <rect x="560" y="352" width="46" height="224" rx="23" fill="url(#brand)"/>
  <g stroke="#ffffff" stroke-width="4" fill="none"><path d="M573 452 a10 10 0 0 1 20 0 v8"/></g>
  <rect x="569" y="459" width="28" height="24" rx="6" fill="#ffffff"/>

  <g stroke="#7c3aed" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M606 464 h64"/><path d="M662 452 l14 12 -14 12"/>
  </g>

  <!-- 그 위에서 일하는 Agent -->
  <rect x="700" y="394" width="270" height="140" rx="34" fill="url(#brand)"/>
  <text x="835" y="478" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="32" font-weight="700" fill="#ffffff">XGEN Agent</text>

  <text x="600" y="640" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#7c3aed">보호 · 권한 · 거버넌스</text>
</svg>
