<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XGEN DeX — 커넥터와 사용자 업무환경을 하나로 묶은 실행 계층">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e8eefb"/>
    </linearGradient>
    <linearGradient id="tbrand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1f4fa8"/>
    </linearGradient>
    <linearGradient id="tdex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#tbg)"/>
  <circle cx="1090" cy="80" r="200" fill="#2f7bff" opacity="0.07"/>

  <text x="600" y="120" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="30" font-weight="700" fill="#2461d8" letter-spacing="8">XGEN DeX</text>

  <!-- 서버 -->
  <rect x="92" y="252" width="196" height="170" rx="22" fill="#ffffff" stroke="#dbe4f6" stroke-width="2"/>
  <text x="190" y="330" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="26" font-weight="800" fill="#1f4fa8">XGEN</text>
  <text x="190" y="366" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="19" fill="#6b7280">Agent 제작</text>

  <g stroke="#8fb4ff" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M300 337 h56"/><path d="M346 325 l13 12 -13 12"/>
  </g>

  <!-- DeX = 커넥터 + 사용자 업무환경 -->
  <rect x="380" y="214" width="728" height="246" rx="30" fill="url(#tdex)" stroke="#2f7bff" stroke-width="3" stroke-dasharray="12 9"/>
  <rect x="380" y="214" width="228" height="48" rx="24" fill="url(#tbrand)"/>
  <text x="494" y="247" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="21" font-weight="800" fill="#ffffff">XGEN DeX</text>

  <rect x="418" y="296" width="300" height="130" rx="20" fill="#ffffff" stroke="#dbe4f6" stroke-width="2"/>
  <text x="568" y="352" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="25" font-weight="800" fill="#1f4fa8">커넥터</text>
  <text x="568" y="388" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="18" fill="#6b7280">연결 · 권한 · 동기화</text>

  <g stroke="#8fb4ff" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M730 361 h44"/><path d="M764 349 l13 12 -13 12"/>
  </g>

  <rect x="792" y="296" width="278" height="130" rx="20" fill="#ffffff" stroke="#dbe4f6" stroke-width="2"/>
  <text x="931" y="352" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="25" font-weight="800" fill="#1f4fa8">업무환경</text>
  <text x="931" y="388" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="18" fill="#6b7280">파일 · 앱 · 브라우저</text>

  <text x="600" y="556" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#374151">설치부터 첫 업무까지, 여섯 단계</text>
</svg>
