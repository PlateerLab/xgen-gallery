<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XGEN DeX 설치부터 첫 업무까지 여섯 단계">
  <!--
    XGEN 프리뷰 썸네일 공통 규격 — 짙은 남색 배경, 왼쪽 두 줄 카피, 오른쪽에
    반투명 흰색 도형 하나. 이 글의 요지는 「여섯 단계」라, 상징도 여섯 칸으로
    두고 마지막 칸만 채워 끝이 있다는 것을 보인다.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1330"/><stop offset="1" stop-color="#1b4fb0"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0fd"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2f7bff" stop-opacity="0.34"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="936" cy="330" r="330" fill="url(#glow)"/>

  <text x="88" y="302" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#ffffff">설치부터</text>
  <text x="88" y="416" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#e4eeff">첫 업무까지</text>

  <!-- 여섯 칸 — 앞의 다섯은 비어 있고 마지막만 채워진다 -->
  <g font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <rect x="672" y="256" width="68" height="68" rx="18" fill="#ffffff3d" stroke="#ffffff99" stroke-width="2"/>
    <text x="706" y="300" fill="#e4eeff">1</text>
    <rect x="756" y="256" width="68" height="68" rx="18" fill="#ffffff3d" stroke="#ffffff99" stroke-width="2"/>
    <text x="790" y="300" fill="#e4eeff">2</text>
    <rect x="840" y="256" width="68" height="68" rx="18" fill="#ffffff3d" stroke="#ffffff99" stroke-width="2"/>
    <text x="874" y="300" fill="#e4eeff">3</text>
    <rect x="924" y="256" width="68" height="68" rx="18" fill="#ffffff3d" stroke="#ffffff99" stroke-width="2"/>
    <text x="958" y="300" fill="#e4eeff">4</text>
    <rect x="1008" y="256" width="68" height="68" rx="18" fill="#ffffff3d" stroke="#ffffff99" stroke-width="2"/>
    <text x="1042" y="300" fill="#e4eeff">5</text>
    <rect x="1092" y="256" width="68" height="68" rx="18" fill="url(#badge)"/>
  </g>
  <path d="M1112 290 l14 14 22 -26" fill="none" stroke="#1b4fb0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M672 372 H 1160" stroke="#ffffff4d" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>
  <text x="916" y="440" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="600" fill="#e4eeff">여섯 단계</text>
</svg>
