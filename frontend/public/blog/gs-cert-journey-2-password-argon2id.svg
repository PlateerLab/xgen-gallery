<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="운영 중인 시스템의 비밀번호 해시를 argon2id로 바꾼 과정">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5faff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#2563eb" opacity="0.05"/>

  <text x="92" y="120" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0284c7">TECH NOTE · GS인증 2편</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <text x="140" y="216" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="46" font-weight="800" fill="#ffffff">2</text>
  <text x="92" y="330" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="46" font-weight="800" fill="#0f172a">비밀번호 해시를</text>
  <text x="92" y="388" font-family="ui-monospace,monospace" font-size="46" font-weight="800" fill="#0284c7">argon2id로</text>
  <rect x="92" y="440" width="300" height="52" rx="26" fill="#e0f2fe"/>
  <text x="118" y="474" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#0369a1">보안성 · 무중단 전환</text>

  <!-- motif: shield with SHA-256 -> argon2id migration -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <path d="M870 200 l112 40 v96 c0 88 -60 150 -112 176 c-52 -26 -112 -88 -112 -176 v-96 z" fill="url(#badge)" opacity="0.12"/>
  <path d="M870 200 l112 40 v96 c0 88 -60 150 -112 176 c-52 -26 -112 -88 -112 -176 v-96 z" fill="none" stroke="#2563eb" stroke-width="4"/>
  <rect x="838" y="330" width="64" height="52" rx="10" fill="#2563eb"/>
  <path d="M852 330 v-16 a18 18 0 0 1 36 0 v16" fill="none" stroke="#2563eb" stroke-width="8"/>
  <circle cx="870" cy="352" r="8" fill="#ffffff"/>
  <rect x="838" y="366" width="4" height="12" fill="#ffffff"/>
  <g font-family="ui-monospace,monospace" font-weight="700">
    <rect x="664" y="470" width="196" height="44" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="762" y="498" text-anchor="middle" font-size="19" fill="#b91c1c" text-decoration="line-through">SHA-256</text>
    <path d="M868 492 l40 0 m-14 -12 l14 12 -14 12" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="916" y="470" width="164" height="44" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="998" y="498" text-anchor="middle" font-size="19" fill="#1f8f52">argon2id</text>
  </g>
</svg>
