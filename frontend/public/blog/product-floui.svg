<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FloUI 질문이 곧 화면이 되는 생성형 UI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5faff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#2563eb" opacity="0.05"/>

  <text x="92" y="120" font-family="'Pretendard Variable',Pretendard,system-ui,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0284c7">제품 소식 · FloUI</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <text x="140" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="#ffffff">F</text>
  <text x="92" y="330" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="46" font-weight="800" fill="#0f172a">질문이</text>
  <text x="92" y="388" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="46" font-weight="800" fill="#0284c7">화면이 되는 UI</text>
  <rect x="92" y="440" width="220" height="52" rx="26" fill="#e0f2fe"/>
  <text x="118" y="474" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#0369a1">생성형 UI</text>

  <!-- motif: prompt -> generated screen -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <rect x="664" y="210" width="200" height="52" rx="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="686" y="243" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="600" fill="#2563eb">“대시보드 만들어줘”</text>
  <path d="M760 274 L 760 316" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <path d="M748 304 L 760 320 L 772 304" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="664" y="330" width="416" height="184" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="684" y="350" width="120" height="16" rx="8" fill="#93c5fd"/>
  <rect x="684" y="384" width="180" height="110" rx="12" fill="#dbeafe"/>
  <rect x="704" y="452" width="24" height="30" rx="4" fill="#2563eb"/>
  <rect x="736" y="436" width="24" height="46" rx="4" fill="#0ea5e9"/>
  <rect x="768" y="460" width="24" height="22" rx="4" fill="#60a5fa"/>
  <rect x="884" y="384" width="176" height="50" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="884" y="444" width="176" height="50" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="912" cy="409" r="14" fill="#93c5fd"/>
  <circle cx="912" cy="469" r="14" fill="#c7d2fe"/>
  <rect x="938" y="402" width="100" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="938" y="462" width="100" height="14" rx="7" fill="#cbd5e1"/>
</svg>
