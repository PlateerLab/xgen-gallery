  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="936" cy="330" r="330" fill="url(#glow)"/>
  <text x="88" y="302" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#ffffff">답변에서</text>
