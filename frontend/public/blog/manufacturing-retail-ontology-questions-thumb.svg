<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="흩어진 문서와 RDB, DW 가 온톨로지를 지나 XGEN Agent 로 이어지는 모습">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e8eaef"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="486" r="330" fill="url(#glow)"/>

  <text x="600" y="170" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#111827">데이터가 아니라</text>
  <text x="600" y="276" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#7c3aed">관계를 연결</text>

  <!-- 기업에 이미 흩어져 있는 것들 -->
  <g>
    <rect x="230" y="352" width="190" height="64" rx="18" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="230" y="432" width="190" height="64" rx="18" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="230" y="512" width="190" height="64" rx="18" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
  </g>
  <g font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="26" font-weight="600" fill="#4b5563" text-anchor="middle">
    <text x="325" y="393">제품 문서</text>
    <text x="325" y="473">운영 RDB</text>
    <text x="325" y="553">DW · 마트</text>
  </g>

  <!-- 온톨로지 — 흩어진 것들을 관계로 묶는 지점 -->
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M420 384 C492 384 492 464 560 464"/>
    <path d="M420 464 h140"/>
    <path d="M420 544 C492 544 492 464 560 464"/>
  </g>

  <!-- 노드와 엣지로 그린 작은 지식 그래프 -->
  <g>
    <rect x="556" y="352" width="118" height="224" rx="28" fill="url(#brand)"/>
    <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85">
      <path d="M592 412 L638 452"/>
      <path d="M638 452 L592 512"/>
      <path d="M592 412 L592 512"/>
    </g>
    <g fill="#ffffff">
      <circle cx="592" cy="412" r="13"/>
      <circle cx="638" cy="452" r="13"/>
      <circle cx="592" cy="512" r="13"/>
    </g>
  </g>

  <g stroke="#7c3aed" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M674 464 h64"/><path d="M730 452 l14 12 -14 12"/>
  </g>

  <!-- 그 위에서 일하는 Agent -->
  <rect x="768" y="394" width="270" height="140" rx="34" fill="url(#brand)"/>
  <text x="903" y="478" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="32" font-weight="700" fill="#ffffff">XGEN Agent</text>

  <text x="600" y="640" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#7c3aed">Data · Knowledge · Agent</text>
</svg>
