    <path d="M1016 386 h20"/>
  </g>

  <!-- 첫 Agent — 여기서 만든 것이 다음으로 이어진다 -->
  <rect x="700" y="238" width="146" height="140" rx="34" fill="url(#brand)"/>
  <g fill="#ffffff">
    <circle cx="748" cy="292" r="11"/>
    <circle cx="798" cy="292" r="11"/>
    <rect x="742" y="326" width="62" height="12" rx="6" opacity="0.9"/>
  </g>

  <!-- 이어받은 업무들 -->
  <g>
    <rect x="916" y="192" width="100" height="76" rx="20" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="916" y="270" width="100" height="76" rx="20" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="916" y="348" width="100" height="76" rx="20" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="1036" y="192" width="100" height="76" rx="20" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="1036" y="270" width="100" height="76" rx="20" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="1036" y="348" width="100" height="76" rx="20" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
  </g>
  <g fill="#a78bfa">
    <rect x="944" y="224" width="44" height="12" rx="6"/>
    <rect x="944" y="302" width="44" height="12" rx="6"/>
    <rect x="944" y="380" width="44" height="12" rx="6"/>
  </g>
  <g fill="#cdd2da">
    <rect x="1064" y="224" width="44" height="12" rx="6"/>
    <rect x="1064" y="302" width="44" height="12" rx="6"/>
    <rect x="1064" y="380" width="44" height="12" rx="6"/>
