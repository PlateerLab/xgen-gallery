<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="첫 Agent 하나에서 갈라져 여러 조직의 업무로 퍼져 나가는 모습">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e8eaef"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.12"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="936" cy="330" r="330" fill="url(#glow)"/>

  <text x="88" y="302" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#111827">동작하는가보다</text>
  <text x="88" y="416" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#7c3aed">확장되는가</text>

  <!-- 하나에서 갈라져 나가는 가지 -->
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M846 308 h38"/>
    <path d="M884 230 v156"/>
    <path d="M884 230 h32"/>
    <path d="M884 308 h32"/>
    <path d="M884 386 h32"/>
    <path d="M1016 230 h20"/>
