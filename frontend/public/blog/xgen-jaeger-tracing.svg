<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Envoy 사이드카에서 OTel 계측으로 — istio-ingressgateway 부터 PostgreSQL 쿼리까지 중첩된 분산 추적 Span 워터폴">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5fbf6"/><stop offset="1" stop-color="#e4f4e8"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#14532d" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#22c55e" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#15803d" opacity="0.05"/>

  <text x="92" y="120" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#15803d">TECH NOTE · 분산 추적</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <rect x="112" y="176" width="56" height="10" rx="5" fill="#ffffff"/>
  <rect x="122" y="193" width="44" height="10" rx="5" fill="#ffffff" opacity="0.78"/>
  <rect x="132" y="210" width="34" height="10" rx="5" fill="#ffffff" opacity="0.56"/>
  <text x="92" y="330" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="46" font-weight="800" fill="#0f172a">Envoy에서</text>
  <text x="92" y="388" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="46" font-weight="800" fill="#15803d">OTel 계측으로</text>
  <rect x="92" y="440" width="336" height="52" rx="26" fill="#dcfce7"/>
  <text x="118" y="474" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="24" font-weight="700" fill="#166534">Jaeger · OpenTelemetry</text>

  <!-- motif: 중첩된 Span 워터폴 — 프록시 레벨에서 애플리케이션 레벨까지 -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <text x="668" y="200" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="19" font-weight="700" fill="#64748b">Service &amp; Operation</text>
  <line x1="668" y1="220" x2="1072" y2="220" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" font-weight="600" fill="#334155">
    <text x="668" y="260">istio-ingressgateway</text>
    <rect x="880" y="248" width="192" height="16" rx="8" fill="#15803d"/>
    <text x="668" y="308">xgen-backend-gateway</text>
    <rect x="896" y="296" width="164" height="16" rx="8" fill="#16a34a"/>
    <text x="668" y="356">xgen-core</text>
    <rect x="916" y="344" width="132" height="16" rx="8" fill="#22c55e"/>
    <text x="668" y="404">GET /api/… handler</text>
    <rect x="940" y="392" width="100" height="16" rx="8" fill="#4ade80"/>
    <text x="668" y="452">SELECT postgresql</text>
    <rect x="960" y="440" width="56" height="16" rx="8" fill="#86efac"/>
    <rect x="1024" y="440" width="40" height="16" rx="8" fill="#86efac"/>
  </g>
  <rect x="668" y="490" width="404" height="30" rx="15" fill="#ecfdf5"/>
  <text x="688" y="511" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="700" fill="#1f8f52">애플리케이션 레벨 Span까지 이어진다</text>
