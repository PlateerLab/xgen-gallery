<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TECH NOTE · LLM 없이 온톨로지 그래프 빌드 — 같은 문서면 같은 그래프">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1fdfb"/><stop offset="1" stop-color="#e2f7f2"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="240" fill="#14b8a6" opacity="0.07"/>
  <circle cx="120" cy="620" r="180" fill="#0f766e" opacity="0.05"/>

  <text x="88" y="302" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#0f172a">같은 문서면</text>
  <text x="88" y="416" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#0d9488">같은 그래프</text>

  <!-- 모티프: LLM 을 걷어냈다 — 커버의 배지와 같은 기호를 원형으로 -->
  <circle cx="960" cy="336" r="186" fill="#ffffff" opacity="0.55"/>
  <circle cx="960" cy="336" r="150" fill="url(#badge)"/>
  <text x="960" y="364" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="76" font-weight="800" fill="#ffffff">LLM</text>
  <path d="M 866 424 L 1054 248" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
</svg>
