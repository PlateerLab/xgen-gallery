<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XGEN DeX — Agent 가 사용자의 업무환경 안에서 일한다">
  <!--
    XGEN 프리뷰 썸네일 공통 규격을 따른다 — 짙은 남색 배경, 왼쪽에 굵은 두 줄
    카피, 오른쪽에 반투명 흰색 도형 하나. 목록에서 형제 글들과 나란히 놓이는
    자리라, 여기서만 밝은 개념도를 쓰면 그 카드만 비어 보인다.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1330"/><stop offset="1" stop-color="#1b4fb0"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0fd"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2f7bff" stop-opacity="0.34"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="936" cy="330" r="330" fill="url(#glow)"/>

  <text x="88" y="302" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#ffffff">내 자리에서</text>
  <text x="88" y="416" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#e4eeff">일하는 Agent</text>

  <!-- 모니터 하나 — 그 안에서 Agent 가 문서를 다룬다 -->
  <rect x="744" y="196" width="372" height="236" rx="24" fill="#ffffff3d" stroke="#ffffff99" stroke-width="2"/>
  <rect x="772" y="224" width="316" height="180" rx="12" fill="#ffffff26"/>
  <g fill="#ffffff6b">
    <rect x="800" y="250" width="150" height="22" rx="8"/>
    <rect x="800" y="290" width="150" height="22" rx="8"/>
    <rect x="800" y="330" width="104" height="22" rx="8"/>
  </g>
  <circle cx="1022" cy="292" r="38" fill="url(#badge)"/>
  <path d="M1000 314a22 22 0 0 1 44 0z" fill="#1b4fb0"/>
  <circle cx="1022" cy="282" r="13" fill="#1b4fb0"/>

  <path d="M900 432 h60 l16 34 h-92z" fill="#ffffff6b"/>
  <rect x="848" y="466" width="164" height="14" rx="7" fill="#ffffff6b"/>
  <text x="930" y="530" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="600" fill="#e4eeff">내 업무환경</text>
</svg>
