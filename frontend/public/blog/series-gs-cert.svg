<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GS인증 개발기 시리즈">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c2a4d"/><stop offset="1" stop-color="#0f4c81"/></linearGradient>
    <linearGradient id="sacc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="1200" height="900" rx="0" fill="url(#sbg)"/>
  <circle cx="1010" cy="150" r="240" fill="#0ea5e9" opacity="0.18"/>
  <circle cx="180" cy="780" r="200" fill="#38bdf8" opacity="0.12"/>

  <text x="90" y="120" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="#7dd3fc">SERIES</text>
  <text x="90" y="210" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="72" font-weight="800" fill="#ffffff">GS인증 개발기</text>
  <rect x="90" y="248" width="150" height="8" rx="4" fill="url(#sacc)"/>

  <!-- motif: 결함리포트 → 검수 통과 → 1등급 인증 -->
  <g transform="translate(600 560)">
    <circle r="210" fill="none" stroke="#2563eb" stroke-width="10" opacity="0.5"/>
    <path d="M 0 -210 A 210 210 0 0 1 182 105" fill="none" stroke="url(#sacc)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 182 105 l 34 -6 l -20 34 z" fill="#38bdf8"/>
    <circle cx="0" cy="-210" r="16" fill="#bae6fd"/>

    <!-- 중앙 카드: 결함리포트 체크 -->
    <rect x="-120" y="-96" width="240" height="192" rx="28" fill="#ffffff"/>
    <text x="-92" y="-52" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#0f172a">결함리포트</text>
    <g stroke-linecap="round" stroke-linejoin="round">
      <rect x="-92" y="-30" width="26" height="26" rx="7" fill="#2563eb"/>
      <path d="M -85 -17 l 6 7 12 -14" fill="none" stroke="#ffffff" stroke-width="5"/>
      <rect x="-56" y="-24" width="140" height="12" rx="6" fill="#dbe4f2"/>
      <rect x="-92" y="6" width="26" height="26" rx="7" fill="#2563eb"/>
      <path d="M -85 19 l 6 7 12 -14" fill="none" stroke="#ffffff" stroke-width="5"/>
      <rect x="-56" y="12" width="120" height="12" rx="6" fill="#dbe4f2"/>
      <rect x="-92" y="42" width="26" height="26" rx="7" fill="#2563eb"/>
      <path d="M -85 55 l 6 7 12 -14" fill="none" stroke="#ffffff" stroke-width="5"/>
      <rect x="-56" y="48" width="150" height="12" rx="6" fill="#dbe4f2"/>
    </g>

    <!-- 1등급 인증 씰 (궤도 위) -->
    <circle cx="210" cy="0" r="46" fill="url(#sacc)"/>
    <circle cx="210" cy="0" r="36" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.65"/>
    <text x="210" y="8" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#ffffff">1등급</text>
    <circle cx="-210" cy="0" r="12" fill="#7dd3fc" opacity="0.75"/>
    <circle cx="0" cy="210" r="10" fill="#7dd3fc" opacity="0.7"/>
  </g>
</svg>
