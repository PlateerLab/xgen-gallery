<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="금융사의 문서, 시스템, 실행, 협업을 보안과 거버넌스가 감싸는 Enterprise AI Agent 구조">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e8eaef"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2b3138" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="1080" cy="90" r="220" fill="#a78bfa" opacity="0.07"/>
  <text x="600" y="92" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#7c3aed" letter-spacing="5">FIELD REPORT</text>
  <text x="600" y="151" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="42" font-weight="800" fill="#111827">금융사가 AI Agent에게 묻는 것</text>
  <g filter="url(#sh)" font-family="Pretendard,'Malgun Gothic',sans-serif">
    <rect x="115" y="218" width="970" height="286" rx="28" fill="#fff"/>
    <rect x="115" y="218" width="970" height="286" rx="28" fill="none" stroke="#ddd6fe" stroke-width="2"/>
    <text x="600" y="257" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed" letter-spacing="2">보안 · 권한 · 거버넌스</text>
    <g font-size="20" font-weight="700">
      <rect x="160" y="304" width="190" height="118" rx="20" fill="#f9fafb" stroke="#e3e6eb"/><text x="255" y="356" text-anchor="middle" fill="#374151">문서 이해</text><text x="255" y="386" text-anchor="middle" font-size="14" fill="#6b7280">RAG · 지식화</text>
      <rect x="380" y="304" width="190" height="118" rx="20" fill="#f9fafb" stroke="#e3e6eb"/><text x="475" y="356" text-anchor="middle" fill="#374151">시스템 연결</text><text x="475" y="386" text-anchor="middle" font-size="14" fill="#6b7280">API · DB · Tool</text>
      <rect x="600" y="304" width="190" height="118" rx="20" fill="#f9fafb" stroke="#e3e6eb"/><text x="695" y="356" text-anchor="middle" fill="#374151">안전한 실행</text><text x="695" y="386" text-anchor="middle" font-size="14" fill="#6b7280">Sandbox · Container</text>
      <rect x="820" y="304" width="190" height="118" rx="20" fill="url(#brand)"/><text x="915" y="356" text-anchor="middle" fill="#fff">Agent 협업</text><text x="915" y="386" text-anchor="middle" font-size="14" fill="#fff">Workflow · MCP</text>
    </g>
  </g>
  <text x="600" y="573" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#4b5563">우리 업무환경 안에서 AI가 실제로 일할 수 있는가?</text>
  <text x="600" y="618" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="16" fill="#7c3aed">ON-PREMISE · BUSINESS-BUILT AGENTS · ENTERPRISE CONTROL</text>
</svg>
