<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LLM 없이 온톨로지 그래프 빌드 — 같은 문서를 두 번 넣어 해시를 대조하면 결과가 일치한다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1fdfb"/><stop offset="1" stop-color="#e2f7f2"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#134e4a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#14b8a6" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#0f766e" opacity="0.05"/>

  <text x="92" y="120" font-family="system-ui,'Segoe UI','Malgun Gothic',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0d9488">TECH NOTE · 결정적 빌드</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <text x="140" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="800" fill="#ffffff">LLM</text>
  <path d="M 108 198 L 172 166" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.92"/>
  <text x="92" y="330" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="46" font-weight="800" fill="#0f172a">LLM 없이</text>
  <text x="92" y="388" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="46" font-weight="800" fill="#0f766e">온톨로지 그래프를</text>
  <rect x="92" y="440" width="352" height="52" rx="26" fill="#ccfbf1"/>
  <text x="118" y="474" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#0f766e">재현 가능 · 외부 호출 0</text>

  <!-- motif: 같은 문서를 두 번 빌드 → 해시 대조 → 일치 -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <text x="668" y="200" font-family="system-ui,'Segoe UI','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#64748b">같은 문서 · 같은 설정</text>
  <line x1="668" y1="220" x2="1072" y2="220" stroke="#e2e8f0" stroke-width="2"/>

  <!-- build 1 -->
  <rect x="668" y="248" width="128" height="56" rx="14" fill="#0d9488"/>
  <text x="732" y="283" text-anchor="middle" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="20" font-weight="800" fill="#ffffff">빌드 1</text>
  <rect x="828" y="248" width="244" height="56" rx="14" fill="#ecfdf5" stroke="#99f6e4" stroke-width="2"/>
  <text x="850" y="283" font-family="ui-monospace,monospace" font-size="19" font-weight="700" fill="#0f766e">a3f1 · 7c20 · e94b</text>

  <!-- build 2 -->
  <rect x="668" y="330" width="128" height="56" rx="14" fill="#14b8a6"/>
  <text x="732" y="365" text-anchor="middle" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="20" font-weight="800" fill="#ffffff">빌드 2</text>
  <rect x="828" y="330" width="244" height="56" rx="14" fill="#ecfdf5" stroke="#99f6e4" stroke-width="2"/>
  <text x="850" y="365" font-family="ui-monospace,monospace" font-size="19" font-weight="700" fill="#0f766e">a3f1 · 7c20 · e94b</text>

  <!-- equality brace -->
  <path d="M 806 276 h 10 M 806 358 h 10" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  <path d="M 816 276 v 82" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>

  <text x="950" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#0d9488">=</text>

  <rect x="668" y="470" width="404" height="44" rx="22" fill="#ccfbf1"/>
  <text x="870" y="499" text-anchor="middle" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="19" font-weight="800" fill="#0f766e">해시 5종 전부 일치 · 회귀 0</text>
</svg>
