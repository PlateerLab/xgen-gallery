<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="서버의 XGEN Agent 와 사용자 PC 의 업무환경이 Connector 를 통해 이어지는 모습">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e8eefb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1f4fa8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#14284f" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#2f7bff" opacity="0.07"/>
  <circle cx="130" cy="610" r="180" fill="#1f4fa8" opacity="0.05"/>

  <text x="600" y="104" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#2461d8" letter-spacing="5">XGEN CONNECTOR</text>
  <text x="600" y="166" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="42" font-weight="800" fill="#111827">Agent를 업무환경으로</text>

  <!-- 서버(XGEN) -->
  <g filter="url(#sh)"><rect x="96" y="260" width="290" height="190" rx="24" fill="#ffffff"/></g>
  <rect x="96" y="260" width="290" height="190" rx="24" fill="none" stroke="#dbe4f6"/>
  <text x="241" y="308" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="19" font-weight="800" fill="#1f4fa8">XGEN</text>
  <g font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="241" y="342">Agent 생성 · 관리</text>
    <text x="241" y="368">데이터 · Tool 연결</text>
    <text x="241" y="394">권한 · 거버넌스</text>
  </g>
  <rect x="150" y="410" width="182" height="26" rx="13" fill="#eef3fd"/>
  <text x="241" y="428" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="12.5" font-weight="700" fill="#2461d8">서버</text>

  <!-- Connector -->
  <g filter="url(#sh)"><rect x="452" y="286" width="296" height="138" rx="22" fill="url(#brand)"/></g>
  <text x="600" y="342" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="22" font-weight="800" fill="#ffffff">Connector</text>
  <text x="600" y="372" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="14" fill="#d7e4ff">Desktop Interface</text>

  <!-- 양쪽 화살표 -->
  <g stroke="#8fb4ff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M394 355 h48"/><path d="M434 347 l9 8 -9 8"/>
    <path d="M758 355 h48"/><path d="M798 347 l9 8 -9 8"/>
  </g>

  <!-- 사용자 PC -->
  <g filter="url(#sh)"><rect x="814" y="260" width="290" height="190" rx="24" fill="#ffffff"/></g>
  <rect x="814" y="260" width="290" height="190" rx="24" fill="none" stroke="#dbe4f6"/>
  <text x="959" y="308" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="19" font-weight="800" fill="#1f4fa8">사용자 PC</text>
  <g font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="959" y="342">파일 · 애플리케이션</text>
    <text x="959" y="368">브라우저 · PowerShell</text>
    <text x="959" y="394">MCP · Skill</text>
  </g>
  <rect x="868" y="410" width="182" height="26" rx="13" fill="#eef3fd"/>
  <text x="959" y="428" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="12.5" font-weight="700" fill="#2461d8">로컬 실행환경</text>

  <!-- 하단 흐름 -->
  <text x="600" y="524" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="19" fill="#4b5563">질문에 답하는 AI에서, 결과물을 만드는 Agent로</text>

  <g font-family="Pretendard,sans-serif" font-size="14.5" font-weight="700">
    <rect x="292" y="562" width="146" height="42" rx="21" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="365" y="589" text-anchor="middle" fill="#6b7280">Request</text>
    <rect x="450" y="562" width="152" height="42" rx="21" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="526" y="589" text-anchor="middle" fill="#6b7280">Understand</text>
    <rect x="614" y="562" width="140" height="42" rx="21" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="684" y="589" text-anchor="middle" fill="#6b7280">Execute</text>
    <rect x="766" y="562" width="142" height="42" rx="21" fill="url(#brand)"/>
    <text x="837" y="589" text-anchor="middle" fill="#ffffff">Deliver</text>
  </g>
</svg>
