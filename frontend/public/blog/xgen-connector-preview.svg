<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XGEN DeX — 서버의 XGEN 이 만든 Agent 가, 커넥터와 사용자 업무환경을 함께 묶은 DeX 안으로 들어와 결과물을 만든다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e8eefb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1f4fa8"/>
    </linearGradient>
    <linearGradient id="dexfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#14284f" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#2f7bff" opacity="0.07"/>
  <circle cx="130" cy="610" r="180" fill="#1f4fa8" opacity="0.05"/>

  <text x="600" y="82" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#2461d8" letter-spacing="6">XGEN DeX</text>
  <text x="600" y="140" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="42" font-weight="800" fill="#111827">Agent를 업무환경으로</text>

  <!-- 서버(XGEN) — 위에서 아래로 내려오는 구도 -->
  <g filter="url(#sh)"><rect x="386" y="180" width="428" height="92" rx="22" fill="#ffffff"/></g>
  <rect x="386" y="180" width="428" height="92" rx="22" fill="none" stroke="#dbe4f6"/>
  <text x="600" y="214" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="19" font-weight="800" fill="#1f4fa8">XGEN · 서버</text>
  <text x="600" y="246" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="14" fill="#4b5563">Agent 생성 · 관리 · 권한 · 거버넌스</text>

  <g stroke="#8fb4ff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M600 276 v40"/><path d="M592 308 l8 9 8 -9"/>
  </g>
  <text x="644" y="304" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#6b8fd0">Agent</text>

  <!--
    DeX 는 가운데 커넥터 하나가 아니다 — 커넥터와 사용자 업무환경을 함께
    묶은 것이 DeX 다. 그래서 둘을 한 테두리 안에 넣고 테두리에 이름을 붙인다.
  -->
  <rect x="118" y="332" width="964" height="196" rx="30" fill="url(#dexfill)" stroke="#2f7bff" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="118" y="332" width="196" height="42" rx="21" fill="url(#brand)"/>
  <text x="216" y="360" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="17" font-weight="800" fill="#ffffff">XGEN DeX</text>

  <!-- 커넥터 -->
  <g filter="url(#sh)"><rect x="152" y="392" width="410" height="106" rx="22" fill="#ffffff"/></g>
  <rect x="152" y="392" width="410" height="106" rx="22" fill="none" stroke="#dbe4f6"/>
  <text x="357" y="428" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="18" font-weight="800" fill="#1f4fa8">커넥터</text>
  <text x="357" y="458" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" fill="#4b5563">서버 연결 · 실행 권한 통제</text>
  <text x="357" y="480" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" fill="#4b5563">작업 폴더 동기화</text>

  <g stroke="#8fb4ff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M574 445 h48"/><path d="M614 437 l9 8 -9 8"/>
  </g>

  <!-- 사용자 업무환경 -->
  <g filter="url(#sh)"><rect x="638" y="392" width="410" height="106" rx="22" fill="#ffffff"/></g>
  <rect x="638" y="392" width="410" height="106" rx="22" fill="none" stroke="#dbe4f6"/>
  <text x="843" y="428" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="18" font-weight="800" fill="#1f4fa8">사용자 업무환경</text>
  <text x="843" y="458" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" fill="#4b5563">파일 · 애플리케이션 · 브라우저</text>
  <text x="843" y="480" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" fill="#4b5563">PowerShell · MCP · Skill</text>

  <text x="600" y="562" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="18" fill="#4b5563">커넥터와 업무환경을 함께 묶은 것이 DeX 입니다</text>

  <!-- 하단 흐름 -->
  <g font-family="Pretendard,sans-serif" font-size="14.5" font-weight="700">
    <rect x="292" y="600" width="146" height="42" rx="21" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="365" y="627" text-anchor="middle" fill="#6b7280">Request</text>
    <rect x="450" y="600" width="152" height="42" rx="21" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="526" y="627" text-anchor="middle" fill="#6b7280">Understand</text>
    <rect x="614" y="600" width="140" height="42" rx="21" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="684" y="627" text-anchor="middle" fill="#6b7280">Execute</text>
    <rect x="766" y="600" width="142" height="42" rx="21" fill="url(#brand)"/>
    <text x="837" y="627" text-anchor="middle" fill="#ffffff">Deliver</text>
  </g>
</svg>
