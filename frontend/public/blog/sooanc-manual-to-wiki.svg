<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="사용자 매뉴얼을 솔루션 가이드 위키로 — 단일 원본에서 다중 산출물">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7ff"/><stop offset="1" stop-color="#ecefff"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#312e81" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#6366f1" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#4338ca" opacity="0.05"/>

  <text x="92" y="120" font-family="'Pretendard Variable',Pretendard,system-ui,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#4f46e5">TECH NOTE · Single Source</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <rect x="122" y="170" width="36" height="46" rx="5" fill="#ffffff"/>
  <rect x="129" y="181" width="22" height="4" rx="2" fill="#6366f1"/>
  <rect x="129" y="191" width="22" height="4" rx="2" fill="#c7d2fe"/>
  <rect x="129" y="201" width="16" height="4" rx="2" fill="#c7d2fe"/>
  <text x="92" y="330" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="46" font-weight="800" fill="#0f172a">사용자 매뉴얼을</text>
  <text x="92" y="388" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="46" font-weight="800" fill="#4f46e5">위키로 바꾸다</text>
  <rect x="92" y="440" width="372" height="52" rx="26" fill="#e0e7ff"/>
  <text x="118" y="474" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#4338ca">단일 원본 · 웹·Word·다국어</text>

  <!-- motif: 원본 하나(MD) → 산출물 여러 개(위키/Word/한글/영문) -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <!-- connectors -->
  <g fill="none" stroke="#c7cbef" stroke-width="5">
    <path d="M 826 346 C 872 346 862 232 908 232"/>
    <path d="M 826 346 C 872 346 862 300 908 300"/>
    <path d="M 826 346 C 872 346 862 392 908 392"/>
    <path d="M 826 346 C 872 346 862 460 908 460"/>
  </g>
  <!-- source -->
  <rect x="672" y="300" width="154" height="92" rx="16" fill="#4338ca"/>
  <text x="749" y="342" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#ffffff">MD 원본</text>
  <text x="749" y="368" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#a5b4fc">.md</text>
  <!-- outputs -->
  <g font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700">
    <rect x="908" y="206" width="164" height="52" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="930" y="239" fill="#4338ca">위키 사이트</text>
    <rect x="908" y="274" width="164" height="52" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="930" y="307" fill="#4338ca">Word(docx)</text>
    <rect x="908" y="366" width="164" height="52" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="930" y="399" fill="#4338ca">한글 문서</text>
    <rect x="908" y="434" width="164" height="52" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="930" y="467" fill="#4338ca">영문 문서</text>
  </g>
</svg>
