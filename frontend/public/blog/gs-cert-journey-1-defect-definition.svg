<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GS인증 결함리포트 80건에서 결함의 정의를 다시 배우다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5faff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#2563eb" opacity="0.05"/>

  <text x="92" y="120" font-family="system-ui,'Segoe UI','Malgun Gothic',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0284c7">TECH NOTE · GS인증 1편</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <text x="140" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#ffffff">1</text>
  <text x="92" y="330" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="46" font-weight="800" fill="#0f172a">결함의 정의를</text>
  <text x="92" y="388" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="46" font-weight="800" fill="#0284c7">다시 배우다</text>
  <rect x="92" y="440" width="272" height="52" rx="26" fill="#e0f2fe"/>
  <text x="118" y="474" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#0369a1">결함리포트 80건</text>

  <!-- motif: defect report with big 80 count + classified rows -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <text x="668" y="236" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#64748b">결함리포트</text>
  <text x="1072" y="250" text-anchor="end" font-family="system-ui,sans-serif" font-size="96" font-weight="800" fill="#0284c7">80</text>
  <text x="1072" y="286" text-anchor="end" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#94a3b8">건</text>
  <line x1="668" y1="312" x2="1072" y2="312" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="system-ui,'Malgun Gothic',sans-serif" font-size="20" font-weight="600">
    <rect x="668" y="332" width="14" height="14" rx="4" fill="#2563eb"/>
    <text x="694" y="345" fill="#334155">기능적합성</text>
    <text x="1072" y="345" text-anchor="end" fill="#0284c7" font-weight="700">41</text>
    <rect x="668" y="372" width="14" height="14" rx="4" fill="#0ea5e9"/>
    <text x="694" y="385" fill="#334155">사용성</text>
    <text x="1072" y="385" text-anchor="end" fill="#0284c7" font-weight="700">30</text>
    <rect x="668" y="412" width="14" height="14" rx="4" fill="#38bdf8"/>
    <text x="694" y="425" fill="#334155">보안성</text>
    <text x="1072" y="425" text-anchor="end" fill="#0284c7" font-weight="700">5</text>
    <rect x="668" y="452" width="14" height="14" rx="4" fill="#7dd3fc"/>
    <text x="694" y="465" fill="#334155">일반 요구사항</text>
    <text x="1072" y="465" text-anchor="end" fill="#0284c7" font-weight="700">4</text>
  </g>
  <rect x="668" y="492" width="404" height="30" rx="15" fill="#ecfdf5"/>
  <text x="688" y="513" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1f8f52">코드 버그는 절반이 되지 않았다</text>
</svg>
