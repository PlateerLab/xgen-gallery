<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XGEN v1.0 — 공인시험으로 확인한 Agentic AI 플랫폼">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5faff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.13"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="110" r="230" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="150" cy="630" r="190" fill="#2563eb" opacity="0.05"/>

  <!-- 텍스트 -->
  <text x="92" y="122" font-family="system-ui,'Segoe UI','Malgun Gothic',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0284c7">제품 소식 · XGEN v1.0</text>
  <text x="92" y="228" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="52" font-weight="800" fill="#0f172a">GS 인증으로 검증된</text>
  <text x="92" y="296" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="52" font-weight="800" fill="#1d4ed8">XGEN 핵심 기능</text>
  <text x="92" y="360" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="25" font-weight="500" fill="#475569">Agent Node · 시스템 연동 · GraphRAG</text>

  <!-- 근거 배지 -->
  <g filter="url(#sh)">
    <rect x="92" y="424" width="290" height="76" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="136" cy="462" r="20" fill="url(#node)"/>
  <path d="M127 462 l7 7 l14 -15" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="455" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#0f172a">최종 결함 0건</text>
  <text x="170" y="480" font-family="system-ui,'Segoe UI',sans-serif" font-size="16" font-weight="500" fill="#64748b">ISO/IEC 25023 · 25051</text>

  <g filter="url(#sh)">
    <rect x="400" y="424" width="230" height="76" rx="20" fill="#ffffff"/>
  </g>
  <text x="428" y="455" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#0f172a">42종 Agent Node</text>
  <text x="428" y="480" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="16" font-weight="500" fill="#64748b">MCP · 로더 · 메모리 · 도구</text>

  <!-- 오른쪽: 에이전트 플로우 캔버스 -->
  <g filter="url(#sh)">
    <rect x="716" y="150" width="404" height="376" rx="28" fill="#ffffff"/>
  </g>
  <rect x="716" y="150" width="404" height="52" rx="28" fill="#f1f7ff"/>
  <rect x="716" y="180" width="404" height="22" fill="#f1f7ff"/>
  <g fill="#cbd5e1">
    <circle cx="748" cy="176" r="6"/>
    <circle cx="770" cy="176" r="6"/>
    <circle cx="792" cy="176" r="6"/>
  </g>
  <text x="820" y="182" font-family="system-ui,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#64748b">agent flow</text>

  <!-- 연결선 -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M814 268 H872"/>
    <path d="M986 268 H1030 V352"/>
    <path d="M918 300 V352 H872"/>
    <path d="M814 384 H872"/>
    <path d="M986 384 H1030"/>
  </g>

  <!-- 노드 -->
  <g>
    <rect x="742" y="244" width="72" height="48" rx="14" fill="url(#node)"/>
    <text x="778" y="274" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#ffffff">start</text>

    <rect x="872" y="236" width="114" height="64" rx="16" fill="#ffffff" stroke="#bcd0f5" stroke-width="2.5"/>
    <text x="929" y="264" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">MCP</text>
    <text x="929" y="284" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" fill="#64748b">tools</text>

    <rect x="872" y="352" width="114" height="64" rx="16" fill="#ffffff" stroke="#bcd0f5" stroke-width="2.5"/>
    <text x="929" y="380" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">retriever</text>
    <text x="929" y="400" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="500" fill="#64748b">GraphRAG</text>

    <rect x="742" y="360" width="72" height="48" rx="14" fill="#e0edff"/>
    <text x="778" y="390" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">docs</text>

    <rect x="1030" y="360" width="62" height="48" rx="14" fill="url(#node)"/>
    <text x="1061" y="390" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#ffffff">end</text>
  </g>

  <!-- 지식 컬렉션 스택 -->
  <g fill="#dbeafe">
    <rect x="748" y="446" width="336" height="14" rx="7"/>
    <rect x="748" y="470" width="252" height="14" rx="7"/>
  </g>

  <text x="92" y="596" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#94a3b8">Plateer Labs · XGEN Agentic AI Platform</text>
