<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="설정을 바꿔도 결과가 같으면 결함입니다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5faff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#2563eb" opacity="0.05"/>

  <text x="92" y="120" font-family="'Pretendard Variable',Pretendard,system-ui,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0284c7">TECH NOTE · GS인증 4편</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <text x="140" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#ffffff">4</text>
  <text x="92" y="330" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="46" font-weight="800" fill="#0f172a">설정을 바꾸면</text>
  <text x="92" y="388" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="46" font-weight="800" fill="#0284c7">결과가 보이도록</text>
  <rect x="92" y="440" width="316" height="52" rx="26" fill="#e0f2fe"/>
  <text x="118" y="474" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#0369a1">관찰 가능성 · 파라미터</text>

  <!-- motif: slider control -> visibly different output -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <text x="668" y="222" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#64748b">최대 결과 수</text>
  <text x="1072" y="222" text-anchor="end" font-family="ui-monospace,monospace" font-size="19" font-weight="700" fill="#0284c7">5</text>
  <rect x="668" y="242" width="404" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="668" y="242" width="250" height="10" rx="5" fill="url(#badge)"/>
  <circle cx="918" cy="247" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>
  <!-- output bars now visibly reflect the setting -->
  <g>
    <rect x="668" y="300" width="404" height="216" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="692" y="328" width="356" height="26" rx="7" fill="#dbeafe"/>
    <rect x="692" y="366" width="300" height="26" rx="7" fill="#dbeafe"/>
    <rect x="692" y="404" width="332" height="26" rx="7" fill="#dbeafe"/>
    <rect x="692" y="442" width="268" height="26" rx="7" fill="#dbeafe"/>
    <rect x="692" y="480" width="312" height="26" rx="7" fill="#dbeafe"/>
    <text x="1024" y="347" text-anchor="end" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#2563eb">#1</text>
    <text x="1024" y="461" text-anchor="end" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#2563eb">#4</text>
  </g>
</svg>
