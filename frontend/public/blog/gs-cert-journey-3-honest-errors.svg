<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="실패를 실패라고 말하게 만드는 오류 처리 정비">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5faff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#2563eb" opacity="0.05"/>

  <text x="92" y="120" font-family="'Pretendard Variable',Pretendard,system-ui,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0284c7">TECH NOTE · GS인증 3편</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <text x="140" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#ffffff">3</text>
  <text x="92" y="330" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="46" font-weight="800" fill="#0f172a">실패를 실패라고</text>
  <text x="92" y="388" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="46" font-weight="800" fill="#0284c7">말하게 만들다</text>
  <rect x="92" y="440" width="256" height="52" rx="26" fill="#e0f2fe"/>
  <text x="118" y="474" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#0369a1">오류 처리 · 검증</text>

  <!-- motif: separated error toast + success toast (no more mixed) -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <g>
    <rect x="668" y="212" width="404" height="76" rx="16" fill="#fef2f2" stroke="#fecaca"/>
    <circle cx="708" cy="250" r="18" fill="#ef4444"/>
    <path d="M700 242 l16 16 m0 -16 l-16 16" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <rect x="744" y="236" width="150" height="14" rx="7" fill="#f4b4b4"/>
    <rect x="744" y="260" width="266" height="12" rx="6" fill="#fbd5d5"/>
  </g>
  <g>
    <rect x="668" y="316" width="404" height="76" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
    <circle cx="708" cy="354" r="18" fill="#22c55e"/>
    <path d="M700 354 l6 7 12 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="744" y="340" width="120" height="14" rx="7" fill="#9ce3bd"/>
    <rect x="744" y="364" width="240" height="12" rx="6" fill="#c9f0da"/>
  </g>
  <g font-family="ui-monospace,monospace" font-size="18" font-weight="700">
    <rect x="668" y="424" width="188" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="762" y="452" text-anchor="middle" fill="#2563eb">필수값 검증</text>
    <rect x="884" y="424" width="188" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="978" y="452" text-anchor="middle" fill="#2563eb">silent 실패 차단</text>
