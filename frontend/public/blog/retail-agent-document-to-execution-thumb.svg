<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="문서 판독에서 구조화를 거쳐 업무 실행으로 이어지는 흐름">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e8eaef"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2b3138" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="240" fill="#a78bfa" opacity="0.08"/>
  <circle cx="120" cy="620" r="180" fill="#7c3aed" opacity="0.05"/>

  <text x="88" y="302" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#111827">읽는 것에서</text>
  <text x="88" y="416" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#7c3aed">실행하는 것까지</text>

  <g filter="url(#sh)">
    <rect x="792" y="140" width="330" height="98" rx="24" fill="#ffffff"/>
    <rect x="792" y="264" width="330" height="98" rx="24" fill="#ffffff"/>
  </g>
  <rect x="792" y="140" width="330" height="98" rx="24" fill="none" stroke="#e3e6eb"/>
  <rect x="792" y="264" width="330" height="98" rx="24" fill="none" stroke="#e3e6eb"/>
  <rect x="792" y="388" width="330" height="98" rx="24" fill="url(#brand)"/>

  <g font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="957" y="200" fill="#374151">문서 판독</text>
    <text x="957" y="324" fill="#6d28d9">구조화 · 검증</text>
    <text x="957" y="448" fill="#ffffff">업무 실행</text>
  </g>
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M957 246 v10"/><path d="M949 250 l8 10 8 -10"/>
    <path d="M957 370 v10"/><path d="M949 374 l8 10 8 -10"/>
