<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="문서에서 읽어낸 내용이 항목이 정해진 업무 데이터로 옮겨지는 모습">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e8eaef"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.12"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="936" cy="330" r="330" fill="url(#glow)"/>

  <text x="88" y="302" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#111827">읽는 것에서</text>
  <text x="88" y="416" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#7c3aed">실행하는 것까지</text>

  <!-- 왼쪽: 아직 읽히지 않은 문서 — 줄만 있고 항목 구분이 없다 -->
  <rect x="700" y="170" width="190" height="276" rx="16" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
  <g fill="#d3d7de">
    <rect x="730" y="208" width="112" height="14" rx="7"/>
    <rect x="730" y="244" width="130" height="14" rx="7"/>
    <rect x="730" y="280" width="96" height="14" rx="7"/>
    <rect x="730" y="316" width="130" height="14" rx="7"/>
    <rect x="730" y="352" width="80" height="14" rx="7"/>
    <rect x="730" y="388" width="118" height="14" rx="7"/>
  </g>

  <!-- 오른쪽: 항목이 정해진 업무 데이터 -->
  <rect x="966" y="170" width="174" height="276" rx="16" fill="url(#brand)"/>
  <g>
    <rect x="994" y="212" width="46" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
    <rect x="1052" y="212" width="60" height="14" rx="7" fill="#ffffff" opacity="0.45"/>
    <rect x="994" y="268" width="46" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
    <rect x="1052" y="268" width="48" height="14" rx="7" fill="#ffffff" opacity="0.45"/>
    <rect x="994" y="324" width="46" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
    <rect x="1052" y="324" width="60" height="14" rx="7" fill="#ffffff" opacity="0.45"/>
    <rect x="994" y="380" width="46" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
    <rect x="1052" y="380" width="40" height="14" rx="7" fill="#ffffff" opacity="0.45"/>
  </g>

  <g stroke="#7c3aed" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M906 308 h34"/><path d="M932 296 l14 12 -14 12"/>
  </g>

  <text x="1140" y="502" text-anchor="end" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#7c3aed">판독 · 구조화 · 적재</text>
</svg>
