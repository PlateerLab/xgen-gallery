<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="하네스 개발기 시리즈">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="sacc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="1200" height="900" rx="0" fill="url(#sbg)"/>
  <circle cx="1010" cy="150" r="240" fill="#6366f1" opacity="0.16"/>
  <circle cx="180" cy="780" r="200" fill="#818cf8" opacity="0.12"/>

  <text x="90" y="120" font-family="system-ui,'Segoe UI',sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="#a5b4fc">SERIES</text>
  <text x="90" y="210" font-family="'Pretendard Variable',Pretendard,system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="72" font-weight="800" fill="#ffffff">하네스 개발기</text>
  <rect x="90" y="248" width="150" height="8" rx="4" fill="url(#sacc)"/>

  <!-- motif: 실행 루프 + 게이트 + 계층 -->
  <g transform="translate(600 560)">
    <circle r="210" fill="none" stroke="#4f46e5" stroke-width="10" opacity="0.5"/>
    <path d="M 0 -210 A 210 210 0 0 1 182 105" fill="none" stroke="url(#sacc)" stroke-width="18" stroke-linecap="round"/>
    <path d="M 182 105 l 34 -6 l -20 34 z" fill="#818cf8"/>
    <circle cx="0" cy="-210" r="16" fill="#c7d2fe"/>
    <!-- 중앙 게이트 노드 -->
    <rect x="-120" y="-70" width="240" height="140" rx="28" fill="#ffffff"/>
    <circle cx="0" cy="0" r="44" fill="url(#sacc)"/>
    <path d="M -20 0 l 14 15 l 26 -30" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 계층 슬래브 -->
    <rect x="-120" y="96" width="240" height="30" rx="10" fill="#4f46e5"/>
    <rect x="-92" y="140" width="184" height="24" rx="10" fill="#6366f1" opacity="0.85"/>
    <rect x="-64" y="178" width="128" height="20" rx="10" fill="#818cf8" opacity="0.7"/>
    <!-- 궤도 점 -->
    <circle cx="210" cy="0" r="12" fill="#a5b4fc"/>
    <circle cx="-210" cy="0" r="10" fill="#a5b4fc" opacity="0.7"/>
    <circle cx="0" cy="210" r="10" fill="#a5b4fc" opacity="0.7"/>
  </g>
</svg>
