  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>
  <line x1="676" y1="252" x2="1064" y2="252" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="1064" y="240" text-anchor="end" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="18" font-weight="800" fill="#ef4444">토큰 한도</text>
  <g fill="#0d9488">
    <rect x="700" y="360" width="62" height="120" rx="8"/>
    <rect x="784" y="300" width="62" height="180" rx="8"/>
    <rect x="868" y="336" width="62" height="144" rx="8"/>
    <rect x="952" y="284" width="62" height="196" rx="8"/>
