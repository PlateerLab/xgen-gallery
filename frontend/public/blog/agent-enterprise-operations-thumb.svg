<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기존 시스템과 데이터를 거쳐 AI Agent 가 업무를 실행하기까지의 가로 흐름">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#e8eaef"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="486" r="330" fill="url(#glow)"/>

  <text x="600" y="170" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#111827">데모를 넘어</text>
  <text x="600" y="276" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="92" font-weight="800" fill="#7c3aed">운영 방식으로</text>
  <g filter="none">
    <rect x="88" y="400" width="220" height="110" rx="26" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="356" y="400" width="220" height="110" rx="26" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="624" y="400" width="220" height="110" rx="26" fill="#ffffff" stroke="#e3e6eb" stroke-width="2"/>
    <rect x="892" y="400" width="220" height="110" rx="26" fill="url(#brand)"/>
  </g>
  <text x="198" y="466" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="600" fill="#374151">기존 시스템</text>
  <text x="466" y="466" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="600" fill="#374151">데이터 · API</text>
  <text x="734" y="466" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#6d28d9">AI Agent</text>
  <text x="1002" y="466" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#ffffff">업무 실행</text>
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none"><path d="M318 455 h28"/><path d="M336 447 l8 8 -8 8"/></g>
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none"><path d="M586 455 h28"/><path d="M604 447 l8 8 -8 8"/></g>
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" fill="none"><path d="M854 455 h28"/><path d="M872 447 l8 8 -8 8"/></g>
  <text x="600" y="596" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="26" font-weight="700" fill="#7c3aed">Monitor · Evaluate · Approve · Deploy · Govern</text>
</svg>
