<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="여섯 단계를 지나면 내 PC 화면에서 Agent 가 아바타로 상주하며 일한다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e8eefb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1f4fa8"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#14284f" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="210" fill="#2f7bff" opacity="0.07"/>
  <circle cx="110" cy="620" r="170" fill="#1f4fa8" opacity="0.05"/>

  <text x="80" y="98" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" font-weight="700" fill="#2461d8" letter-spacing="6">XGEN DeX</text>
  <text x="80" y="154" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="40" font-weight="800" fill="#111827">설치부터 첫 업무까지</text>
  <text x="80" y="192" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="17" fill="#4b5563">여섯 단계를 지나면, Agent 가 내 화면에서 일합니다</text>

  <!-- 여섯 단계 — 이 글이 실습편이라 개념도가 아니라 밟아 가는 순서를 보여준다 -->
  <g font-family="Pretendard,'Malgun Gothic',sans-serif">
    <g>
      <circle cx="102" cy="266" r="17" fill="url(#brand)"/>
      <text x="102" y="272" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">1</text>
      <text x="134" y="272" font-size="17" font-weight="700" fill="#111827">설치</text>
      <text x="196" y="272" font-size="14.5" fill="#6b7280">SmartScreen · 설치 폴더</text>
    </g>
    <path d="M102 288 v22" stroke="#bcd0f5" stroke-width="2" stroke-linecap="round"/>
    <g>
      <circle cx="102" cy="332" r="17" fill="url(#brand)"/>
      <text x="102" y="338" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">2</text>
      <text x="134" y="338" font-size="17" font-weight="700" fill="#111827">서버 연결</text>
      <text x="238" y="338" font-size="14.5" fill="#6b7280">게이트웨이 · SSO</text>
    </g>
    <path d="M102 354 v22" stroke="#bcd0f5" stroke-width="2" stroke-linecap="round"/>
    <g>
      <circle cx="102" cy="398" r="17" fill="url(#brand)"/>
      <text x="102" y="404" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">3</text>
      <text x="134" y="404" font-size="17" font-weight="700" fill="#111827">Agent 제작</text>
      <text x="252" y="404" font-size="14.5" fill="#6b7280">XGeny 에게 말로</text>
    </g>
    <path d="M102 420 v22" stroke="#bcd0f5" stroke-width="2" stroke-linecap="round"/>
    <g>
      <circle cx="102" cy="464" r="17" fill="url(#brand)"/>
      <text x="102" y="470" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">4</text>
      <text x="134" y="470" font-size="17" font-weight="700" fill="#111827">PC 연결</text>
      <text x="224" y="470" font-size="14.5" fill="#6b7280">작업 폴더 동기화</text>
    </g>
    <path d="M102 486 v22" stroke="#bcd0f5" stroke-width="2" stroke-linecap="round"/>
    <g>
      <circle cx="102" cy="530" r="17" fill="url(#brand)"/>
      <text x="102" y="536" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">5</text>
      <text x="134" y="536" font-size="17" font-weight="700" fill="#111827">권한 열기</text>
      <text x="238" y="536" font-size="14.5" fill="#6b7280">셸 · 파일 · MCP</text>
    </g>
    <path d="M102 552 v22" stroke="#bcd0f5" stroke-width="2" stroke-linecap="round"/>
    <g>
      <circle cx="102" cy="596" r="17" fill="url(#brand)"/>
      <text x="102" y="602" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">6</text>
      <text x="134" y="602" font-size="17" font-weight="800" fill="#2461d8">업무 맡기기</text>
    </g>
  </g>

  <!-- 결과 — 내 화면에 Agent 가 상주한다 -->
  <g filter="url(#sh)"><rect x="596" y="238" width="524" height="330" rx="20" fill="#ffffff"/></g>
  <rect x="596" y="238" width="524" height="330" rx="20" fill="none" stroke="#dbe4f6"/>
  <rect x="596" y="238" width="524" height="40" rx="20" fill="#f2f6fd"/>
  <rect x="596" y="262" width="524" height="16" fill="#f2f6fd"/>
  <circle cx="622" cy="258" r="5" fill="#ff5f57"/><circle cx="640" cy="258" r="5" fill="#febc2e"/><circle cx="658" cy="258" r="5" fill="#28c840"/>
  <text x="690" y="264" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#8b95a6">XGEN DeX</text>

  <!-- 대화 -->
  <rect x="628" y="306" width="268" height="46" rx="12" fill="#f3f6fb"/>
  <path d="M646 322h150M646 338h96" stroke="#c6d2e4" stroke-width="6" stroke-linecap="round"/>
  <rect x="760" y="368" width="328" height="46" rx="12" fill="url(#brand)"/>
  <path d="M780 384h230M780 400h150" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <rect x="628" y="430" width="300" height="60" rx="12" fill="#f3f6fb"/>
  <rect x="646" y="444" width="86" height="18" rx="9" fill="#d9f0e2"/>
  <text x="689" y="457" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="10.5" font-weight="700" fill="#2f7d55">WebSearch</text>
  <path d="M646 476h240" stroke="#c6d2e4" stroke-width="6" stroke-linecap="round"/>

  <!-- 입력줄 -->
  <rect x="628" y="512" width="460" height="34" rx="17" fill="#ffffff" stroke="#dbe4f6"/>
  <path d="M650 529h150" stroke="#dbe4f6" stroke-width="6" stroke-linecap="round"/>

  <!--
    아바타 — Agent 가 창 안에만 있지 않고 화면에 상주한다는 것이 이 글의 결말이다.
    본문 6단계의 마지막 화면과 같은 자리(오른쪽 아래)에 세운다.
  -->
  <g transform="translate(1010 400)">
    <ellipse cx="46" cy="176" rx="52" ry="9" fill="#1f4fa8" opacity="0.10"/>
    <path d="M4 172c0-30 19-54 42-54s42 24 42 54z" fill="url(#figure)"/>
    <circle cx="46" cy="96" r="28" fill="url(#figure)"/>
    <path d="M22 84c2-16 12-26 24-26s22 10 24 26c-8-6-16-9-24-9s-16 3-24 9z" fill="#123a72"/>
    <circle cx="36" cy="98" r="6.5" fill="none" stroke="#123a72" stroke-width="2.5"/>
    <circle cx="58" cy="98" r="6.5" fill="none" stroke="#123a72" stroke-width="2.5"/>
    <path d="M42.5 98h9" stroke="#123a72" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.95">
      <circle cx="-2" cy="62" r="17"/>
      <path d="M-8 66l-7 9 11-3z"/>
    </g>
    <path d="M-9 58c0-4 3-7 7-7 2 0 3 1 4 2 1-1 2-2 4-2 4 0 7 3 7 7 0 5-11 11-11 11S-9 63-9 58z" fill="#ff6b8a"/>
  </g>

  <text x="858" y="612" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="16" fill="#4b5563">창을 닫아도 아바타는 남습니다</text>
</svg>
