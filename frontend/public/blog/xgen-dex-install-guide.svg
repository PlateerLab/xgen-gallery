<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XGEN DeX — 커넥터와 사용자 업무환경을 하나로 묶은 실행 계층. 서버의 XGEN 이 만든 Agent 가 그 안으로 들어와 일한다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e8eefb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1f4fa8"/>
    </linearGradient>
    <linearGradient id="dexfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#14284f" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#2f7bff" opacity="0.07"/>
  <circle cx="130" cy="610" r="180" fill="#1f4fa8" opacity="0.05"/>

  <text x="600" y="86" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="23" font-weight="700" fill="#2461d8" letter-spacing="6">XGEN DeX</text>
  <text x="600" y="146" text-anchor="middle" font-family="Pretendard,'Pretendard Variable','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="42" font-weight="800" fill="#111827">설치부터 첫 업무까지</text>

  <!-- 서버(XGEN) — Agent 를 만드는 곳 -->
  <g filter="url(#sh)"><rect x="80" y="252" width="238" height="196" rx="24" fill="#ffffff"/></g>
  <rect x="80" y="252" width="238" height="196" rx="24" fill="none" stroke="#dbe4f6"/>
  <text x="199" y="300" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="19" font-weight="800" fill="#1f4fa8">XGEN</text>
  <g font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="199" y="336">XGeny 로 Agent 제작</text>
    <text x="199" y="362">데이터 · Tool 연결</text>
    <text x="199" y="388">권한 · 거버넌스</text>
  </g>
  <rect x="118" y="404" width="162" height="26" rx="13" fill="#eef3fd"/>
  <text x="199" y="422" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="12.5" font-weight="700" fill="#2461d8">서버</text>

  <!-- Agent 가 넘어오는 화살표 -->
  <g stroke="#8fb4ff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M326 350 h56"/><path d="M374 342 l9 8 -9 8"/>
  </g>
  <text x="354" y="330" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#6b8fd0">Agent</text>

  <!--
    DeX 는 커넥터만이 아니다 — 커넥터와 사용자 업무환경을 함께 묶은 것이
    DeX 다. 그래서 둘을 한 테두리 안에 넣고 그 테두리에 이름을 붙인다.
  -->
  <rect x="398" y="214" width="726" height="272" rx="30" fill="url(#dexfill)" stroke="#2f7bff" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="398" y="214" width="196" height="42" rx="21" fill="url(#brand)"/>
  <text x="496" y="242" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="17" font-weight="800" fill="#ffffff">XGEN DeX</text>

  <!-- 커넥터 -->
  <g filter="url(#sh)"><rect x="432" y="288" width="286" height="164" rx="22" fill="#ffffff"/></g>
  <rect x="432" y="288" width="286" height="164" rx="22" fill="none" stroke="#dbe4f6"/>
  <text x="575" y="330" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="18" font-weight="800" fill="#1f4fa8">커넥터</text>
  <g font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" fill="#4b5563" text-anchor="middle">
    <text x="575" y="362">서버 연결 · 세션</text>
    <text x="575" y="386">실행 권한 통제</text>
    <text x="575" y="410">작업 폴더 동기화</text>
  </g>
  <rect x="494" y="424" width="162" height="14" rx="7" fill="#eef3fd"/>

  <!-- 이어짐 -->
  <g stroke="#8fb4ff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M726 370 h44"/><path d="M762 362 l9 8 -9 8"/>
  </g>

  <!-- 사용자 업무환경 -->
  <g filter="url(#sh)"><rect x="786" y="288" width="304" height="164" rx="22" fill="#ffffff"/></g>
  <rect x="786" y="288" width="304" height="164" rx="22" fill="none" stroke="#dbe4f6"/>
  <text x="938" y="330" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="18" font-weight="800" fill="#1f4fa8">사용자 업무환경</text>
  <g font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" fill="#4b5563" text-anchor="middle">
    <text x="938" y="362">파일 · 애플리케이션</text>
    <text x="938" y="386">브라우저 · PowerShell</text>
    <text x="938" y="410">MCP · Skill</text>
  </g>
  <rect x="857" y="424" width="162" height="14" rx="7" fill="#eef3fd"/>

  <text x="761" y="524" text-anchor="middle" font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="18" fill="#4b5563">커넥터와 업무환경을 함께 묶은 것이 DeX 입니다</text>

  <!-- 여섯 단계 -->
  <g font-family="Pretendard,'Malgun Gothic',sans-serif" font-size="13.5" font-weight="700">
    <rect x="176" y="566" width="118" height="40" rx="20" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="235" y="592" text-anchor="middle" fill="#6b7280">설치</text>
    <rect x="306" y="566" width="132" height="40" rx="20" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="372" y="592" text-anchor="middle" fill="#6b7280">서버 연결</text>
    <rect x="450" y="566" width="150" height="40" rx="20" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="525" y="592" text-anchor="middle" fill="#6b7280">Agent 제작</text>
    <rect x="612" y="566" width="132" height="40" rx="20" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="678" y="592" text-anchor="middle" fill="#6b7280">PC 연결</text>
    <rect x="756" y="566" width="132" height="40" rx="20" fill="#ffffff" stroke="#dbe4f6"/>
    <text x="822" y="592" text-anchor="middle" fill="#6b7280">권한 열기</text>
    <rect x="900" y="566" width="132" height="40" rx="20" fill="url(#brand)"/>
    <text x="966" y="592" text-anchor="middle" fill="#ffffff">업무 맡기기</text>
  </g>
</svg>
