<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XGeny — Memory·Workspace·Schedule 을 기본으로 갖춘 Agent 가 수많은 Tool 가운데 필요한 것만 검색해 꺼내 쓰는 구조">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5faff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1e3a8a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="220" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="140" cy="620" r="180" fill="#2563eb" opacity="0.05"/>

  <text x="92" y="120" font-family="system-ui,'Segoe UI','Malgun Gothic',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0284c7">제품 소식 · XGeny</text>
  <rect x="92" y="150" width="96" height="96" rx="24" fill="url(#badge)"/>
  <text x="140" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="#ffffff">G</text>
  <text x="92" y="330" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="46" font-weight="800" fill="#0f172a">답변하는 AI에서</text>
  <text x="92" y="388" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="46" font-weight="800" fill="#0284c7">일하는 Agent로</text>
  <rect x="92" y="440" width="330" height="52" rx="26" fill="#e0f2fe"/>
  <text x="118" y="474" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#0369a1">Workspace · Tool Search</text>

  <!-- motif: 기본 실행 환경을 갖춘 Agent 가 Tool 선반에서 필요한 것만 꺼낸다 -->
  <g filter="url(#sh)"><rect x="628" y="150" width="484" height="392" rx="28" fill="#ffffff"/></g>

  <!-- Agent + 기본 실행 환경 -->
  <rect x="668" y="196" width="188" height="128" rx="18" fill="#2563eb"/>
  <text x="762" y="244" text-anchor="middle" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#ffffff">XGeny</text>
  <text x="762" y="272" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#bfdbfe">Agent Runtime</text>
  <g font-family="system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">
    <rect x="668" y="338" width="88" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/><text x="712" y="358" text-anchor="middle">Memory</text>
    <rect x="764" y="338" width="92" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/><text x="810" y="358" text-anchor="middle">Schedule</text>
    <rect x="668" y="376" width="188" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/><text x="762" y="396" text-anchor="middle">Workspace</text>
  </g>

  <!-- Tool Search — 전부 주지 않고 필요한 것만 꺼낸다 -->
  <path d="M872 300 h44" stroke="#93b4e8" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
  <path d="M908 292 l10 8 -10 8" fill="none" stroke="#93b4e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="894" y="278" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#64748b">search</text>

  <rect x="928" y="196" width="144" height="248" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <g fill="#e2e8f0">
    <rect x="948" y="220" width="44" height="34" rx="8"/>
    <rect x="1004" y="220" width="44" height="34" rx="8"/>
    <rect x="1004" y="266" width="44" height="34" rx="8"/>
    <rect x="948" y="312" width="44" height="34" rx="8"/>
    <rect x="1004" y="312" width="44" height="34" rx="8"/>
    <rect x="1004" y="358" width="44" height="34" rx="8"/>
    <rect x="948" y="404" width="44" height="34" rx="8"/>
  </g>
  <rect x="948" y="266" width="44" height="34" rx="8" fill="#2563eb"/>
  <rect x="948" y="358" width="44" height="34" rx="8" fill="#7dd3fc"/>
  <rect x="1004" y="404" width="44" height="34" rx="8" fill="#7dd3fc"/>
  <text x="1000" y="470" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#64748b">Tools</text>

  <rect x="668" y="490" width="404" height="30" rx="15" fill="#ecfdf5"/>
  <text x="688" y="511" font-family="system-ui,'Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1f8f52">없으면 직접 만들어 Workspace에 남긴다</text>
</svg>
